<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almanac">
<title>Baccarat</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="cards.css">
<link rel="stylesheet" href="course.css">
<link rel="stylesheet" href="casino.css">
<link rel="stylesheet" href="baccarat.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="baccarat fit-screen beside">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon bc-mark" aria-hidden="true"></span>Baccarat</button></h1>
    <div class="top-right">
      <button id="learnBtn" class="pick" aria-haspopup="dialog">Learn</button>
      <button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button>
    </div>
  </header>

  <div class="cs-strip bc-strip">
    <span>HK$ <b id="balance">0</b></span>
    <span id="limits" class="cs-cut"></span>
    <span id="shoe" class="cs-cut"></span>
  </div>

  <section id="board" class="bc-board" aria-label="The scoreboard">
    <div id="roads" class="bc-roads-box"></div>
    <div class="bc-stats">
      <span id="counts" class="bc-counts"></span>
      <button id="askB" class="bc-ask b" type="button" aria-label="Banker ask: where the next hand would go if the Banker won"><b>莊問</b><span class="bc-ask-marks"></span></button>
      <button id="askP" class="bc-ask p" type="button" aria-label="Player ask: where the next hand would go if the Player won"><b>閒問</b><span class="bc-ask-marks"></span></button>
    </div>
  </section>

  <section id="felt" class="bc-felt fit-grow" aria-label="The table">
    <div class="bc-hands">
      <div class="bc-hand p"><div class="bc-hand-head"><b>閒</b><span>Player</span><i class="bc-total" id="ptotal"></i></div><div class="bc-cards" id="pcards"></div></div>
      <div class="bc-hand b"><div class="bc-hand-head"><b>莊</b><span>Banker</span><i class="bc-total" id="btotal"></i></div><div class="bc-cards" id="bcards"></div></div>
    </div>
    <p id="call" class="bc-call" aria-live="polite"></p>
    <div id="spots" class="bc-spots"></div>
  </section>

  <section class="cs-rail bc-rail" aria-label="Your chips">
    <div id="chips" class="cs-chips" role="radiogroup" aria-label="Chip"></div>
    <div class="cs-go">
      <button id="clearBtn" class="cs-btn" type="button">Clear</button>
      <button id="rebetBtn" class="cs-btn" type="button">Rebet</button>
      <button id="dealBtn" class="cs-btn primary" type="button">Deal</button>
    </div>
  </section>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<dialog id="rulesDlg" class="sheet bc-sheet" aria-label="The rules on one page">
  <div class="pick-head"><h2>Baccarat on one page</h2><button class="btn" type="button" id="rulesClose">Close</button></div>
  <div id="rulesBody" class="cs-rules"></div>
</dialog>

<p id="toast" class="cs-toast" role="status" aria-live="polite"></p>
<script type="module" src="baccarat.js"></script>
</body>
</html>
