<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Codex">
<title>Dispatch</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="dispatch.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="dispatch full titled fit-screen">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon dp-mark" aria-hidden="true"></span>Dispatch</button></h1>
    <div class="top-right"><button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button></div>
  </header>
  <div class="dp-strip full-pull"><span id="where"></span><span id="clock" class="dp-clock"></span></div>
  <section id="stage" class="dp-stage fit-grow fit-scroll" aria-live="polite"></section>
  <div class="dp-bar">
    <button class="btn primary" type="button" id="goBtn">Next</button>
  </div>
</div>
<dialog id="pickDlg" class="sheet" aria-label="Choose">
  <div class="pick-head"><h2 id="pickTitle">Choose</h2><button class="btn" type="button" id="pickClose">Close</button></div>
  <div id="pickBody" class="dp-pick"></div>
</dialog>
<dialog id="doneDlg" class="sheet" aria-label="How it went">
  <div class="pick-head"><h2 id="doneTitle">Done</h2><button class="btn" type="button" id="doneClose">Close</button></div>
  <div id="doneBody"></div>
</dialog>
<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>
<script type="module" src="dispatch.js"></script>
<script type="module" src="sfx.js"></script>
</body>
</html>
