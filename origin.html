<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almanac">
<title>Origin</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="origin.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="origin fit-screen">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon og-mark" aria-hidden="true"></span>Origin</button></h1>
    <div class="top-right"><button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button></div>
  </header>
  <div class="og-strip"><span id="where"></span><span id="score" class="og-score"></span></div>
  <section class="og-card fit-col fit-grow" id="card">
    <ol id="clues" class="og-clues fit-scroll" aria-label="Clues"></ol>
    <ul id="guesses" class="og-guesses" aria-label="Your guesses"></ul>
    <form id="guessForm" class="og-guess" autocomplete="off">
      <input id="guessIn" list="countryList" placeholder="Name a country" aria-label="Your guess" autocapitalize="words" spellcheck="false">
      <button class="og-go" type="submit" id="guessBtn">Guess</button>
    </form>
    <datalist id="countryList"></datalist>
    <div class="og-more"><button class="og-quiet" type="button" id="clueBtn"></button><button class="link" type="button" id="giveBtn">Give up</button></div>
    <div id="result" class="og-result" hidden>
      <p id="verdict" class="og-verdict"></p>
      <p id="note" class="og-note"></p>
      <button class="og-go" type="button" id="nextBtn">Next</button>
    </div>
  </section>
</div>
<dialog id="doneDlg" class="sheet" aria-label="How it went">
  <div class="pick-head"><h2 id="doneTitle">Run over</h2><button class="btn" type="button" id="doneClose">Close</button></div>
  <div id="doneBody"></div>
</dialog>
<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<p id="toast" class="og-toast" role="status" aria-live="polite"></p>
<script type="module" src="origin.js"></script>
</body>
</html>
