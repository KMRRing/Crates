<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almanac">
<title>Gambit</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="gambit.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="gambit fit-screen beside">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon gb-mark" aria-hidden="true"></span>Gambit</button></h1>
    <div class="top-right">
      <button id="rulesBtn" class="pick" aria-haspopup="dialog">Rules</button>
      <button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button>
    </div>
  </header>

  <div id="far" class="gb-seat gb-far"></div>
  <section id="stage" class="gb-stage fit-grow fit-box" aria-label="The board">
    <div id="board" class="gb-board"></div>
  </section>
  <div id="near" class="gb-seat gb-near" aria-live="polite"></div>
  <p id="coach" class="gb-coach" aria-live="polite" hidden></p>
  <ol id="list" class="gb-list" aria-label="The moves"></ol>
  <div id="bar" class="gb-bar"></div>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<dialog id="rulesDlg" class="sheet gb-sheet" aria-label="Rules">
  <div class="pick-head"><h2>Rules</h2><button class="btn" type="button" id="rulesClose">Close</button></div>
  <div id="rulesBody" class="gb-rules"></div>
</dialog>

<dialog id="endDlg" class="sheet gb-sheet" aria-labelledby="endHead">
  <h2 id="endHead" class="gb-end-head"></h2>
  <div id="endBody" class="gb-end"></div>
  <div class="gb-end-go"><button class="gb-go quiet" type="button" id="endBoard">The board</button><button class="gb-go" type="button" id="endAgain">New game</button></div>
</dialog>

<dialog id="nameDlg" class="sheet" aria-label="Your name">
  <form method="dialog" id="nameForm">
    <label for="nameInput">Your name, so your partner knows who's playing</label>
    <input id="nameInput" maxlength="16" autocomplete="nickname" required>
    <button class="btn primary wide" type="submit">Continue</button>
  </form>
</dialog>

<p id="toast" class="gb-toast" role="status" aria-live="polite"></p>
<script type="module" src="gambit.js"></script>
</body>
</html>
