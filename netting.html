<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almanac">
<title>Netting</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="netting.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="netting fit-screen beside">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon nt-mark" aria-hidden="true"></span>Netting</button></h1>
    <div class="top-right"><button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button></div>
  </header>

  <div class="nt-strip">
    <span class="nt-score">Score <b id="score">0</b></span>
    <span id="lives" class="nt-lives"></span>
    <span class="nt-best">Best <b id="best">0</b></span>
  </div>
  <section id="ring" class="nt-ring fit-grow fit-box" aria-label="The houses">
    <svg id="board" class="nt-board" xmlns="http://www.w3.org/2000/svg" viewBox="-50 -50 100 100" role="img" aria-label="The houses and what they owe"></svg>
  </section>

  <section class="nt-side">
    <p id="line" class="nt-line"></p>
    <div id="tray" class="nt-tray">
      <button class="nt-card" type="button" data-slot="0"></button>
      <button class="nt-card" type="button" data-slot="1"></button>
      <button class="nt-card" type="button" data-slot="2"></button>
    </div>
    <div id="result" class="nt-result" hidden>
      <p id="verdict" class="nt-verdict"></p>
      <button class="nt-go" type="button" id="againBtn">New game</button>
    </div>
  </section>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<p id="toast" class="nt-toast" role="status" aria-live="polite"></p>
<script type="module" src="netting.js"></script>
</body>
</html>
