<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almanac">
<title>River</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="river.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="river fit-screen beside">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon rv-mark" aria-hidden="true"></span>River</button></h1>
    <div class="top-right">
      <button id="learnBtn" class="pick" aria-haspopup="dialog">Learn</button>
      <button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button>
    </div>
  </header>

  <div id="rushHud" class="rv-rush rv-rush-hud">
    <span class="rv-rush-solved"><b id="rushSolved">0</b> solved <small class="rv-rush-rating">rating <b id="rushRating"></b></small></span>
    <span class="rv-rush-clock" id="rushClock"></span>
    <span id="rushStrikes" class="rv-rush-strikes" role="img" aria-label="Strikes"></span>
  </div>
  <p id="rushLine" class="rv-rush rv-rush-line" aria-live="polite"></p>
  <div id="far" class="rv-seat rv-far"></div>
  <section id="stage" class="rv-stage fit-grow fit-box" aria-label="The board">
    <div id="board" class="rv-board"></div>
    <div id="rushBoard" class="rv-board rv-rush"></div>
  </section>
  <div id="near" class="rv-seat rv-near" aria-live="polite"></div>
  <p id="coach" class="rv-coach" aria-live="polite" hidden></p>
  <ol id="list" class="rv-list" aria-label="The moves"></ol>
  <div id="bar" class="rv-bar"></div>
  <p id="rushMeta" class="rv-rush rv-rush-meta"></p>
  <div id="rushBar" class="rv-rush rv-bar"></div>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<dialog id="rulesDlg" class="sheet rv-sheet" aria-label="Rules">
  <div class="pick-head"><h2>Rules</h2><button class="btn" type="button" id="rulesClose">Close</button></div>
  <div id="rulesBody" class="rv-rules"></div>
</dialog>

<dialog id="endDlg" class="sheet rv-sheet" aria-labelledby="endHead">
  <h2 id="endHead" class="rv-end-head"></h2>
  <div id="endBody" class="rv-end"></div>
  <div class="rv-end-go"><button class="rv-go quiet" type="button" id="endBoard">The board</button><button class="rv-go" type="button" id="endAgain">New game</button></div>
</dialog>

<dialog id="rushDlg" class="sheet rv-sheet" aria-labelledby="rushHead">
  <div class="pick-head"><h2 id="rushHead">Time</h2><button class="btn" type="button" id="rushClose">Close</button></div>
  <div id="rushBody" class="rv-rush-done"></div>
</dialog>

<dialog id="nameDlg" class="sheet" aria-label="Your name">
  <form method="dialog" id="nameForm">
    <label for="nameInput">Your name, so your partner knows who's playing</label>
    <input id="nameInput" maxlength="16" autocomplete="nickname" required>
    <button class="btn primary wide" type="submit">Continue</button>
  </form>
</dialog>

<p id="toast" class="rv-toast" role="status" aria-live="polite"></p>
<script type="module" src="river.js"></script>
</body>
</html>
