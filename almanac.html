<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Codex">
<title>Almanac</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="almanac.css">
<link rel="stylesheet" href="themes.css">
</head>
<body class="on-sky">
<div id="app" class="almanac full fit-screen beside">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon lx-mark" aria-hidden="true"></span>Almanac</button></h1>
    <div class="top-right"><button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button></div>
  </header>
  <form id="searchForm" class="lx-search" role="search" autocomplete="off">
    <input id="q" type="search" placeholder="Search anything: a country, a company, a painting…" aria-label="Search the Almanac" spellcheck="false" autocapitalize="off">
  </form>
  <div class="lx-modes" role="group" aria-label="How to look">
    <button id="modeList" class="lx-mode" type="button" aria-pressed="true">List</button>
    <button id="modeSky" class="lx-mode" type="button" aria-pressed="false">Star chart</button>
  </div>
  <section id="results" class="lx-results fit-scroll fit-grow" aria-label="Results"></section>
  <article id="entry" class="lx-entry fit-scroll fit-grow" hidden></article>
</div>

<!-- the star chart is what Almanac opens on: the whole screen, with a search field and the menu on it, and its popups -->
<section id="sky" class="sk" aria-label="Star chart">
  <canvas id="skyGL" class="sk-gl" aria-hidden="true"></canvas>
  <canvas id="skyInk" class="sk-ink" aria-label="The star chart, a sky of constellations: drag to turn it, pinch or scroll to zoom, tap a star for its entry" tabindex="0"></canvas>
  <div class="sk-top">
    <form id="skySearch" class="sk-search" role="search" autocomplete="off">
      <svg class="sk-glass" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5.5 5.5"/></svg>
      <input id="skyQ" type="search" placeholder="Search" aria-label="Search the star chart" spellcheck="false" autocapitalize="off" enterkeyhint="search">
    </form>
    <button id="skyMenu" class="pick sk-menu" type="button" aria-haspopup="dialog" aria-label="Menu">Menu</button>
  </div>
  <div id="skyHits" class="sk-pop sk-hits" role="listbox" aria-label="Search results" hidden></div>
  <div id="skyFoot" class="sk-foot">
    <p id="skyHint" class="sk-hint"></p>
    <div class="sk-chips">
      <button id="skySubjects" class="sk-chip" type="button" aria-expanded="false" aria-haspopup="dialog">Constellations</button>
      <button id="skyHome" class="sk-chip" type="button">Reset view</button>
    </div>
  </div>
  <div id="skyLegend" class="sk-pop sk-subjects" role="dialog" aria-label="Constellations" hidden></div>
  <div id="skyCard" class="sk-pop sk-entry" role="dialog" aria-label="Entry" hidden></div>
  <div id="skyTag" class="sk-tag" role="status" hidden><b></b><small></small></div>
  <div id="skyMsg" class="sk-msg" role="status" hidden></div>
</section>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<p id="toast" class="lx-toast" role="status" aria-live="polite"></p>
<script type="module" src="almanac.js"></script>
</body>
</html>
