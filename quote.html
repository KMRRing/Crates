<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E4E7E7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141B20" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quote">
<title>Quote</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="quote.css">
</head>
<body>
<div id="app" class="quote">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon qt-mark" aria-hidden="true"></span>Quote</button></h1>
    <div class="top-right"><button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button></div>
  </header>

  <p id="partner" class="qt-partner" hidden></p>
  <div class="qt-strip"><span id="where"></span><span class="qt-book" id="books">Book <b id="book">1,000</b></span></div>

  <section class="qt-card">
    <span id="cat" class="qt-cat"></span>
    <h2 id="question" class="qt-q"></h2>
    <div id="picture" class="qt-picture" hidden></div>
    <p id="unit" class="qt-unit"></p>

    <div id="market" class="qt-market">
      <label class="qt-side"><span>Bid</span><input id="bid" inputmode="decimal" autocomplete="off" aria-label="Bid"></label>
      <span class="qt-dash" aria-hidden="true">–</span>
      <label class="qt-side"><span>Ask</span><input id="ask" inputmode="decimal" autocomplete="off" aria-label="Ask"></label>
    </div>
    <div id="widths" class="qt-widths" aria-label="Set the width"></div>
    <p id="fault" class="qt-fault" role="alert"></p>
    <button class="qt-go" type="button" id="quoteBtn">Quote</button>
    <p id="waiting" class="qt-waiting" hidden></p>
    <div id="takeBox" class="qt-take" hidden>
      <p class="qt-shown">Their market: <b id="shown"></b></p>
      <button class="qt-go" type="button" id="hitBtn"></button>
      <button class="qt-go" type="button" id="liftBtn"></button>
      <button class="qt-go quiet" type="button" id="passBtn">Pass</button>
    </div>

    <div id="result" class="qt-result" hidden>
      <p class="qt-verdict" id="verdict"></p>
      <div class="qt-tape" id="tape"></div>
      <p class="qt-note" id="note"></p>
      <button class="qt-go" type="button" id="nextBtn">Next</button>
    </div>
  </section>
</div>

<dialog id="doneDlg" class="sheet" aria-label="How it went">
  <div class="pick-head"><h2>Closing bell</h2><button class="btn" type="button" id="doneClose">Close</button></div>
  <div id="doneBody"></div>
</dialog>

<dialog id="nameDlg" class="sheet" aria-label="Your name">
  <form method="dialog" id="nameForm">
    <label for="nameInput">Your name, so your partner knows who's playing</label>
    <input id="nameInput" maxlength="16" autocomplete="nickname" required>
    <button class="btn primary wide" type="submit">Continue</button>
  </form>
</dialog>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<p id="toast" class="qt-toast" role="status" aria-live="polite"></p>
<script type="module" src="quote.js"></script>
</body>
</html>
