<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Codex">
<title>Crates</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="dropdown.css">
<link rel="stylesheet" href="crates-board.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="crates cboard full fit-screen beside">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon cr-mark" aria-hidden="true"></span>Crates</button>
    </h1>
    <div class="top-right">
      <button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button>
    </div>
  </header>

  <div class="cb-strip full-pull">
    <span class="cb-what" id="what"></span>
    <span class="cb-count" id="count"></span>
  </div>
  <p class="cb-sub" id="sub" hidden></p>

  <section class="cb-stage fit-grow fit-box" aria-label="The board">
    <div class="cb-board" id="board"></div>
  </section>

  <ol class="cb-feed" id="feed" aria-label="Guesses this board"></ol>
  <p class="cb-line" id="line" aria-live="polite"></p>
  <div class="cb-controls" id="controls">
    <button class="btn" type="button" id="shuffleBtn">Shuffle</button>
    <button class="btn" type="button" id="clearBtn">Deselect</button>
    <button class="btn primary" type="button" id="submitBtn" disabled>Submit</button>
  </div>
</div>

<dialog id="nameDlg" class="sheet">
  <form id="nameForm" method="dialog">
    <p class="sheet-words" id="nameWords"></p>
    <label for="nameInput" id="nameLabel"></label>
    <input id="nameInput" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="done">
    <div class="controls">
      <button type="button" id="skipBtn" class="btn">Skip</button>
      <button type="submit" id="nameBtn" class="btn primary">Name it</button>
    </div>
  </form>
</dialog>

<dialog id="menuDlg" class="sheet">
  <div class="pick-head">
    <h2>Crates <span id="pNum"></span></h2>
    <button id="menuClose" class="btn">Close</button>
  </div>
  <div id="menuBody"></div>
</dialog>

<dialog id="whoDlg" class="sheet">
  <form id="whoForm" method="dialog">
    <label for="whoInput">Your name, as your partner will see it</label>
    <input id="whoInput" autocomplete="nickname" autocapitalize="words" spellcheck="false" enterkeyhint="done" maxlength="16">
    <div class="controls">
      <button type="submit" class="btn primary">Continue</button>
    </div>
  </form>
</dialog>

<script src="bank.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
