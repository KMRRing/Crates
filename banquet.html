<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almanac">
<title>Banquet</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="banquet.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="banquet fit-screen beside">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon bq-mark" aria-hidden="true"></span>Banquet</button></h1>
    <div class="top-right">
      <button id="rulesBtn" class="pick" aria-haspopup="dialog">Rules</button>
      <button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button>
    </div>
  </header>

  <section id="table" class="bq-table fit-grow" aria-label="The table">
    <div id="them" class="bq-seat them"></div>
    <div id="centre" class="bq-centre" aria-live="polite"></div>
  </section>
  <section id="side" class="bq-side" aria-label="Your hand">
    <div id="mine" class="bq-seat mine"></div>
    <div id="controls" class="bq-controls"></div>
  </section>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<dialog id="rulesDlg" class="sheet bq-sheet" aria-label="Rules">
  <div class="pick-head"><h2>Rules</h2><button class="btn" type="button" id="rulesClose">Close</button></div>
  <div id="rulesBody" class="bq-rules"></div>
</dialog>

<dialog id="endDlg" class="sheet bq-sheet" aria-labelledby="endHead">
  <h2 id="endHead" class="bq-end-head"></h2>
  <div id="endBody" class="bq-end"></div>
  <div class="bq-end-go"><button class="btn" type="button" id="endTable">The table</button><button class="btn primary" type="button" id="endAgain">New game</button></div>
</dialog>

<p id="toast" class="bq-toast" role="status" aria-live="polite"></p>
<script type="module" src="banquet.js"></script>
</body>
</html>
