# Waiting to move to .github/workflows/pages.yml: the GitHub token needs the Workflows and Pages permissions first
# (see CLAUDE.md). Then Pages deploys from this workflow instead of straight from the branch.
#
# Every push to main: the tests, then the site. sw.js (the offline file list and its version) is built here rather
# than committed, so several people, or several Claudes, can push without colliding on it. A push that fails a test
# isn't deployed: the site stays on the last good version until it's fixed. A newer push cancels an older run.
name: Test and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The banks are built from kb/ and current
        run: node tools/build-kb.mjs --check
      - name: Every game's tests
        run: for t in tests/*.mjs; do echo "== $t"; node "$t"; done
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build sw.js
        run: node tools/build-sw.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
