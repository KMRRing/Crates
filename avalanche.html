<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almanac">
<title>Avalanche</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="avalanche.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="avalanche fit-screen beside">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon av-mark" aria-hidden="true"></span>Avalanche</button></h1>
    <div class="top-right"><button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button></div>
  </header>

  <div class="av-strip">
    <span class="av-score">Score <b id="score">0</b></span>
    <span id="lives" class="av-lives"></span>
    <span class="av-best">Best <b id="best">0</b></span>
  </div>
  <section id="slope" class="av-slope fit-grow fit-box" aria-label="The slope">
    <svg id="board" class="av-board" xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 74 91" role="img" aria-label="The slope"></svg>
  </section>

  <section class="av-side">
    <div id="tray" class="av-tray">
      <p id="line" class="av-line"></p>
      <div class="av-acts">
        <span id="charges" class="av-charges" role="img"></span>
        <button class="av-undo" type="button" id="undoBtn">Undo</button>
        <button class="av-go" type="button" id="fireBtn">Fire</button>
      </div>
    </div>
    <div id="result" class="av-result" hidden>
      <p id="verdict" class="av-verdict"></p>
      <button class="av-go" type="button" id="againBtn">New game</button>
    </div>
  </section>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<p id="toast" class="av-toast" role="status" aria-live="polite"></p>
<script type="module" src="avalanche.js"></script>
</body>
</html>
