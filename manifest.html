<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E4E7E7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141B20" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Manifest">
<title>Manifest</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="manifest.css">
</head>
<body>
<div id="app" class="manifest">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon mf-mark" aria-hidden="true"></span>Manifest</button></h1>
    <div class="top-right"><button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button></div>
  </header>

  <div class="mf-hud">
    <span class="mf-round" id="round"></span>
    <span class="mf-score"><b id="score">0</b></span>
    <span id="lives" class="mf-lives" aria-label="Lives"></span>
  </div>

  <section class="mf-stage">
    <p class="mf-title" id="title"></p>
    <div class="mf-timer" id="timer"><i></i></div>
    <div id="view" class="mf-view"></div>
    <p class="mf-question" id="question" hidden></p>
    <div id="answers" class="mf-answers"></div>
    <p class="mf-verdict" id="verdict" hidden></p>
    <button class="mf-go" type="button" id="goBtn" hidden></button>
  </section>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<p id="toast" class="mf-toast" role="status" aria-live="polite"></p>
<script type="module" src="manifest.js"></script>
</body>
</html>
