<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almanac">
<title>Acrostic</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="duel.css">
<link rel="stylesheet" href="acrostic.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="acrostic fit-screen beside">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon ac-mark" aria-hidden="true"></span>Acrostic</button></h1>
    <div class="top-right">
      <button id="rulesBtn" class="pick" aria-haspopup="dialog">Rules</button>
      <button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button>
    </div>
  </header>

  <div class="ac-strip" id="strip">
    <span class="ac-clock"><b id="clock">0:00</b><small id="pen"></small></span>
    <span class="ac-count" id="count"></span>
    <span class="ac-rival" id="rival" hidden></span>
  </div>

  <section class="ac-text fit-scroll" id="textBox" aria-label="The hidden text">
    <div class="ac-board" id="board"></div>
  </section>

  <section class="ac-side fit-half" id="side">
    <div class="ac-spine" id="spine"></div>
    <section class="ac-clues fit-grow fit-scroll" id="clues" aria-label="The clues"></section>
    <div class="ac-dock" id="dock">
      <div class="ac-actions" id="actions">
        <button class="btn" type="button" id="undoBtn">Undo</button>
        <button class="btn" type="button" id="checkBtn">Check</button>
        <button class="btn" type="button" id="hintBtn">Hint</button>
      </div>
      <div class="ac-done" id="donePanel" hidden>
        <p class="ac-verdict" id="verdict"></p>
        <button class="ac-go" type="button" id="nextBtn">New puzzle</button>
      </div>
      <div class="ac-kbd" id="kbd" aria-label="Keyboard"></div>
    </div>
  </section>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<dialog id="rulesDlg" class="sheet ac-sheet" aria-label="Rules">
  <div class="pick-head"><h2>Rules</h2><button class="btn" type="button" id="rulesClose">Close</button></div>
  <div id="rulesBody" class="ac-rules"></div>
</dialog>

<dialog id="doneDlg" class="sheet" aria-label="Solved">
  <div class="pick-head"><h2 id="doneTitle">Solved</h2><button class="icon-btn menu-x" type="button" id="doneClose" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="ac-reveal" id="reveal"></div>
  <button class="btn primary wide" type="button" id="doneNext">New puzzle</button>
</dialog>

<dialog id="nameDlg" class="sheet" aria-label="Your name">
  <form method="dialog">
    <label for="nameInput">Your name, so your partner knows who's playing</label>
    <input id="nameInput" maxlength="24" autocomplete="nickname" enterkeyhint="go">
    <button class="btn primary wide" type="submit">Play</button>
  </form>
</dialog>

<p id="toast" class="ac-toast" role="status" aria-live="polite"></p>
<script type="module" src="acrostic.js"></script>
</body>
</html>
