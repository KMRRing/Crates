<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Codex">
<title>Crossing</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="crossing.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="crossing full titled fit-screen beside">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon cx-mark" aria-hidden="true"></span>Crossing</button></h1>
    <div class="top-right"><button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button></div>
  </header>
  <div class="cx-strip full-pull"><span id="where"></span><span id="score" class="cx-score"></span></div>
  <section class="cx-deal" id="deal">
    <h2 class="cx-route" id="route"></h2>
    <p class="cx-trail" id="trail"></p>
  </section>
  <div class="cx-mapbox fit-grow"><canvas id="map" class="cx-map" aria-label="The map: tap the country to cross into"></canvas></div>
  <div class="cx-bar" id="bar">
    <button class="btn" type="button" id="backBtn">Back a step</button>
    <button class="btn" type="button" id="giveBtn">Give up</button>
    <button class="btn primary" type="button" id="nextBtn" hidden>Next</button>
  </div>
</div>
<dialog id="doneDlg" class="sheet" aria-label="How it went">
  <div class="pick-head"><h2 id="doneTitle">Run over</h2><button class="btn" type="button" id="doneClose">Close</button></div>
  <div id="doneBody"></div>
</dialog>
<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<p id="toast" class="cx-toast" role="status" aria-live="polite"></p>
<script type="module" src="crossing.js"></script>
<script type="module" src="sfx.js"></script>
</body>
</html>
