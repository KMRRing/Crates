<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E4E7E7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141B20" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Blend">
<title>Blend</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="blend.css">
</head>
<body>
<div id="app" class="blend">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon bl-mark" aria-hidden="true"></span>Blend</button></h1>
    <div class="top-right">
      <select id="level" class="pool" aria-label="Level">
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
        <option value="expert">Expert</option>
      </select>
      <button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button>
    </div>
  </header>

  <div class="bl-strip"><span id="brief"></span><span id="count" class="bl-count"></span></div>

  <section class="bl-card">
    <p class="bl-label">The components</p>
    <table class="bl-table" id="table"></table>
    <p class="bl-label">Your trial</p>
    <div id="recipe" class="bl-recipe"></div>
    <button class="bl-go" type="button" id="labBtn">Send to the lab</button>
    <p class="bl-label" id="historyLabel" hidden>The lab's verdicts, against the sample</p>
    <ol id="history" class="bl-history"></ol>
    <div id="result" class="bl-result" hidden>
      <p class="bl-verdict" id="verdict"></p>
      <button class="bl-go" type="button" id="nextBtn">Another sample</button>
    </div>
  </section>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<p id="toast" class="bl-toast" role="status" aria-live="polite"></p>
<script type="module" src="blend.js"></script>
</body>
</html>
