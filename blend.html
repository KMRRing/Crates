<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E4E7E7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141B20" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Blend">
<title>Blend</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="blend.css">
</head>
<body>
<div id="app" class="blend fit-screen">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon bl-mark" aria-hidden="true"></span>Blend</button></h1>
    <div class="top-right">
      <select id="level" class="pool" aria-label="Order"></select>
      <button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button>
    </div>
  </header>

  <section class="bl-order">
    <div class="bl-order-head"><h2 id="title"></h2><button class="bl-about" type="button" id="aboutBtn">About</button></div>
    <p class="bl-product" id="product"></p>
    <p class="bl-intro" id="intro" hidden></p>
  </section>
  <section class="bl-margin">
    <div class="bl-margin-row"><span>Margin</span><b id="margin"></b><small id="par"></small></div>
    <div class="bl-bar"><i id="marginBar"></i><em id="parTick"></em></div>
    <p class="bl-costline" id="costline"></p>
    <div class="bl-buttons">
      <p class="bl-verdict" id="verdict"></p>
      <button class="bl-go quiet" type="button" id="hintBtn">Hint</button>
      <button class="bl-go" type="button" id="certifyBtn" disabled>Certify</button>
    </div>
  </section>
  <section class="bl-spec-box" aria-label="Specification: tap a line for why">
    <div id="spec" class="bl-chips"></div>
  </section>
  <section class="bl-farm fit-col fit-grow" aria-label="Tank farm">
    <div class="bl-farm-head"><h3>Tank farm <small>tap a name for its note</small></h3><p class="bl-total" id="total"></p></div>
    <div id="components" class="bl-components fit-grow fit-scroll"></div>
  </section>
</div>

<dialog id="whyDlg" class="sheet" aria-label="Why">
  <div class="pick-head"><h2 id="whyTitle"></h2><button class="btn" type="button" id="whyClose">Close</button></div>
  <p id="whyBody" class="bl-why"></p>
</dialog>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<p id="toast" class="bl-toast" role="status" aria-live="polite"></p>
<script type="module" src="blend.js"></script>
</body>
</html>
