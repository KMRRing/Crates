<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almanac">
<title>Calibre</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="calibre.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="calibre fit-screen">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon cb-mark" aria-hidden="true"></span>Calibre</button></h1>
    <div class="top-right"><button id="courseBtn" class="pick" aria-haspopup="dialog">Course</button><button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button></div>
  </header>
  <div class="cb-strip"><span id="where"></span><span id="stars" class="cb-stars"></span></div>
  <section class="cb-brief">
    <p id="task" class="cb-task"></p>
    <div id="scenes" class="cb-scenes" hidden></div>
    <ul id="goals" class="cb-goals" aria-label="Goals"></ul>
    <div id="editor" class="cb-editor" hidden></div>
    <label id="indexRow" class="cb-index" hidden><span>Index − slow</span><input id="index" type="range" min="-1" max="1" step="0.001" value="0"><span>fast +</span><b id="indexOut"></b></label>
    <p id="hint" class="cb-hint" hidden></p>
    <div id="work" class="cb-work" hidden></div>
    <div class="cb-help"><button id="lessonBtn" class="cb-link" type="button">Lesson</button><button id="workBtn" class="cb-link" type="button">Workings</button><button id="hintBtn" class="cb-link" type="button">Hint</button><button id="testBtn" class="cb-link" type="button" hidden>Test</button></div>
  </section>
  <div id="stage" class="cb-stage fit-grow">
    <svg id="plan" class="cb-plan" aria-label="The calibre plan: tap to place the chosen part; drag to move, pinch to zoom"></svg>
    <div class="cb-zoom"><button type="button" id="view3dBtn" class="cb-3dbtn" aria-pressed="false" title="The movement in 3D: each layer at its height">3D</button><button type="button" id="zoomIn" aria-label="Zoom in">+</button><button type="button" id="zoomOut" aria-label="Zoom out">−</button></div>
    <div id="inspect" class="cb-inspect" hidden></div>
  </div>
  <div id="tray" class="cb-tray" aria-label="Parts"></div>
  <div class="cb-controls">
    <div id="layers" class="cb-layers" role="radiogroup" aria-label="Layer"></div>
    <button id="undoBtn" class="btn cb-undo" type="button" aria-label="Undo">↶</button>
    <button id="windBtn" class="btn cb-wind" type="button">Wind</button>
  </div>
</div>
<dialog id="lessonDlg" class="sheet cb-lesson" aria-labelledby="lessonTitle">
  <div class="pick-head"><h2 id="lessonTitle">Lesson</h2><button class="btn" type="button" id="lessonClose">Close</button></div>
  <div class="cb-lesson-steps"><div id="lessonDots" class="cb-dots" aria-label="Steps"></div><span id="lessonCount" class="cb-count"></span></div>
  <svg id="lessonScene" class="cb-lesson-scene" role="img" aria-label="The part this step is about, on its own and running"></svg>
  <p id="lessonReadout" class="cb-readout"></p>
  <div id="lessonSay" class="cb-say"></div>
  <div class="cb-lesson-nav"><button class="btn" type="button" id="lessonBack">Back</button><button class="btn primary" type="button" id="lessonNext">Next</button></div>
</dialog>
<dialog id="testDlg" class="sheet cb-test" aria-labelledby="testTitle">
  <div class="pick-head"><h2 id="testTitle">Test</h2><button class="btn" type="button" id="testClose">Close</button></div>
  <div class="cb-lesson-steps"><div id="testDots" class="cb-dots cb-qdots" aria-hidden="true"></div><span id="testCount" class="cb-count"></span></div>
  <div id="testBody" class="cb-test-body">
    <svg id="testScene" class="cb-lesson-scene cb-test-scene" role="img" aria-label="The movement the question is about"></svg>
    <p id="testAsk" class="cb-ask"></p>
    <div id="testAnswer" class="cb-answer"></div>
    <p id="testSays" class="cb-says" aria-live="polite"></p>
  </div>
  <div class="cb-lesson-nav"><button class="btn" type="button" id="testAlt" hidden>Test again</button><button class="btn primary" type="button" id="testNext">Next</button></div>
</dialog>
<dialog id="glossDlg" class="sheet cb-scrolls" aria-label="Glossary">
  <div class="pick-head"><h2>Glossary</h2><button class="btn" type="button" id="glossClose">Close</button></div>
  <div id="glossBody" class="cb-primer"></div>
</dialog>
<dialog id="courseDlg" class="sheet cb-scrolls" aria-label="Course">
  <div class="pick-head"><h2>Course</h2><button class="btn" type="button" id="courseClose">Close</button></div>
  <div id="courseBody" class="cb-course"></div>
</dialog>
<dialog id="doneDlg" class="sheet" aria-label="It runs">
  <div class="pick-head"><h2 id="doneTitle">It runs</h2><button class="btn" type="button" id="doneClose">Close</button></div>
  <div id="doneBody"></div>
</dialog>
<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>
<p id="toast" class="cb-toast" role="status" aria-live="polite"></p>
<script type="module" src="calibre.js"></script>
</body>
</html>
