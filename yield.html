<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Codex">
<title>Constellation</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="duel.css">
<link rel="stylesheet" href="yield.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="yield full titled fit-screen beside">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon yd-mark" aria-hidden="true"></span>Constellation</button></h1>
    <div class="top-right">
      <button id="rulesBtn" class="pick" aria-haspopup="dialog">Rules</button>
      <button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button>
    </div>
  </header>

  <button id="gauge" class="yd-gauge" type="button" aria-haspopup="dialog">
    <span class="yd-rank"><b id="rank">Dark sky</b><span id="clock" class="yd-clock" hidden></span><span id="points" class="yd-points">0</span></span>
    <span id="scale" class="yd-scale" aria-hidden="true"></span>
  </button>

  <section class="yd-side fit-half">
    <div class="yd-found-row">
      <button id="foundBtn" class="yd-found" type="button" aria-haspopup="dialog">
        <span class="yd-found-head"><b id="foundCount">0 words</b><span id="foundLeft"></span></span>
        <span id="foundList" class="yd-found-list"></span>
      </button>
      <button id="shadowBtn" class="yd-shadow-btn" type="button" aria-pressed="false" aria-label="Shadows: light the sight-lines the missing words travel">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"/><circle cx="12" cy="12" r="2.6"/></svg><span>Shadows</span></button>
    </div>
    <p id="duelLine" class="yd-rival" hidden></p>
  </section>

  <section class="yd-play fit-grow fit-col" aria-label="The board">
    <p id="word" class="yd-word" aria-live="polite"></p>
    <p id="line" class="yd-line" aria-live="polite"></p>
    <div id="board" class="yd-board fit-grow" role="group" aria-label="The stars"></div>
    <div class="yd-keys">
      <button id="delBtn" class="yd-key" type="button" aria-label="Delete a letter (hold to clear)">Delete</button>
      <button id="hintBtn" class="yd-key yd-hint" type="button" aria-label="Hint: the start of the easiest word left">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l1.9 5.6 5.6 1.9-5.6 1.9-1.9 5.6-1.9-5.6L4.5 11l5.6-1.9z"/></svg></button>
      <button id="enterBtn" class="yd-key yd-enter" type="button">Enter</button>
    </div>
  </section>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<dialog id="rulesDlg" class="sheet yd-sheet" aria-label="Rules">
  <div class="pick-head"><h2>Rules</h2><button class="btn" type="button" id="rulesClose">Close</button></div>
  <div id="rulesBody" class="yd-rules"></div>
</dialog>

<dialog id="sheetDlg" class="sheet menu-sheet yd-sheet" aria-labelledby="sheetTitle">
  <div class="pick-head"><h2 id="sheetTitle"></h2><button class="icon-btn menu-x" type="button" id="sheetClose" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div id="sheetBody" class="yd-sheet-body"></div>
</dialog>

<p id="toast" class="yd-toast" role="status" aria-live="polite"></p>
<script type="module" src="yield.js"></script>
</body>
</html>
