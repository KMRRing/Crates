<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almanac">
<title>Yield</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="dropdown.css">
<link rel="stylesheet" href="duel.css">
<link rel="stylesheet" href="yield.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="yield fit-screen beside">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon yd-mark" aria-hidden="true"></span>Yield</button></h1>
    <div class="top-right">
      <select id="pick" class="pool" data-accent="yd" aria-label="Puzzle">
        <option value="today" data-note="The same seven letters for everyone, Medium">Today's</option>
        <option value="light" data-note="Everyday words take you to the top">Light</option>
        <option value="medium" data-note="The top needs a few less common words">Medium</option>
        <option value="heavy" data-note="The top needs words people rarely use">Heavy</option>
      </select>
      <button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button>
    </div>
  </header>

  <button id="gauge" class="yd-gauge" type="button" aria-haspopup="dialog">
    <span class="yd-rank"><b id="rank">Crude</b><span id="clock" class="yd-clock" hidden></span><span id="points" class="yd-points">0</span></span>
    <span id="scale" class="yd-scale" aria-hidden="true"></span>
  </button>

  <section class="yd-side fit-half">
    <div class="yd-found-row">
      <button id="foundBtn" class="yd-found" type="button" aria-haspopup="dialog">
        <span class="yd-found-head"><b id="foundCount">0 words</b><span id="foundLeft"></span></span>
        <span id="foundList" class="yd-found-list"></span>
      </button>
      <button id="chartBtn" class="yd-chart-btn" type="button" aria-haspopup="dialog" aria-label="The yield chart: what's left, by first letter and length">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4.5h16M4 9.5h16M4 14.5h16M4 19.5h16M9 4.5v15M14.5 4.5v15"/></svg><span>Chart</span></button>
    </div>
    <p id="duelLine" class="yd-rival" hidden></p>
    <p id="vs" class="yd-rival" hidden></p>
  </section>

  <section class="yd-play fit-grow fit-col" aria-label="The board">
    <p id="word" class="yd-word" aria-live="polite"></p>
    <p id="line" class="yd-line" aria-live="polite"></p>
    <div id="board" class="yd-board fit-grow" role="group" aria-label="Letters"></div>
    <div class="yd-keys">
      <button id="delBtn" class="yd-key" type="button" aria-label="Delete a letter (hold to clear)">Delete</button>
      <button id="mixBtn" class="yd-key yd-mix" type="button" aria-label="Shuffle the letters"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5a8 8 0 0 0-14.3-4.9M4 12.5a8 8 0 0 0 14.3 4.9"/><path d="M5.2 2.8v4.3h4.3M18.8 21.2v-4.3h-4.3"/></svg></button>
      <button id="enterBtn" class="yd-key yd-enter" type="button">Enter</button>
    </div>
  </section>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<dialog id="sheetDlg" class="sheet menu-sheet yd-sheet" aria-labelledby="sheetTitle">
  <div class="pick-head"><h2 id="sheetTitle"></h2><button class="icon-btn menu-x" type="button" id="sheetClose" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div id="sheetBody" class="yd-sheet-body"></div>
</dialog>

<p id="toast" class="yd-toast" role="status" aria-live="polite"></p>
<script type="module" src="yield.js"></script>
</body>
</html>
