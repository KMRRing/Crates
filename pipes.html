<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almanac">
<title>Pipes</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="duel.css">
<link rel="stylesheet" href="pipes.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="pipes fit-screen beside">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon pi-mark" aria-hidden="true"></span>Pipes</button></h1>
    <div class="top-right">
      <button id="rulesBtn" class="pick" aria-haspopup="dialog">Rules</button>
      <button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button>
    </div>
  </header>

  <div class="pi-hud">
    <div class="pi-numbers">
      <span class="pi-stat"><small id="stat1Label">Level</small><b id="stat1">1</b></span>
      <span class="pi-stat main"><small>Score</small><b id="score">0</b></span>
      <span class="pi-stat"><small id="stat3Label">To go</small><b id="stat3">0</b></span>
    </div>
    <small id="rival" class="pi-rival" hidden></small>
  </div>

  <div id="queue" class="pi-queue" aria-label="The pieces to come"></div>

  <section class="pi-stage fit-grow" aria-label="The board">
    <div id="board" class="pi-board"></div>
    <div id="shaft" class="pi-shaft" hidden></div>
    <div id="card" class="pi-card" role="group" hidden></div>
  </section>

  <div class="pi-bar">
    <p class="pi-status"><span id="status"></span><span id="ahead" class="pi-ahead" hidden></span></p>
    <div id="flatControls" class="pi-controls flat">
      <button class="pi-go" type="button" id="goBtn">Oil now</button>
    </div>
    <div id="deepControls" class="pi-controls deep" hidden>
      <button class="pi-key" type="button" id="holdBtn"><b>Hold</b><small id="holdNote">set aside</small></button>
      <button class="pi-key" type="button" id="scrapBtn"><b>Scrap</b><small>oil surges</small></button>
      <button class="pi-key" type="button" id="turnBtn"><b>Turn</b><small>or tap</small></button>
      <button class="pi-key lay" type="button" id="layBtn"><b>Lay</b><small id="layNote">it in</small></button>
      <button class="pi-key" type="button" id="hurryBtn"><b>Hurry</b><small id="hurryNote">×5</small></button>
    </div>
  </div>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<dialog id="rulesDlg" class="sheet pi-sheet" aria-label="Rules">
  <div class="pick-head"><h2>Rules</h2><button class="btn" type="button" id="rulesClose">Close</button></div>
  <div id="rulesBody" class="pi-rules"></div>
</dialog>

<p id="toast" class="pi-toast" role="status" aria-live="polite"></p>
<script type="module" src="pipes.js"></script>
</body>
</html>
