<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almanac">
<title>Polder</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="polder.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="polder fit-screen beside">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon pd-mark" aria-hidden="true"></span>Polder</button></h1>
    <div class="top-right"><button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button></div>
  </header>

  <div class="pd-strip">
    <span class="pd-score">Score <b id="score">0</b></span>
    <span id="silt" class="pd-silt"></span>
    <span class="pd-best">Best <b id="best">0</b></span>
  </div>
  <section id="sea" class="pd-sea fit-grow fit-box" aria-label="The sea">
    <svg id="board" class="pd-board" xmlns="http://www.w3.org/2000/svg" viewBox="-3 -3 86 91" role="img" aria-label="The sea"></svg>
  </section>

  <section class="pd-side">
    <div id="tray" class="pd-tray">
      <button class="pd-piece" type="button" data-slot="0"></button>
      <button class="pd-piece" type="button" data-slot="1"></button>
      <button class="pd-piece" type="button" data-slot="2"></button>
    </div>
    <div id="result" class="pd-result" hidden>
      <p id="verdict" class="pd-verdict"></p>
      <button class="pd-go" type="button" id="againBtn">New game</button>
    </div>
  </section>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<p id="toast" class="pd-toast" role="status" aria-live="polite"></p>
<script type="module" src="polder.js"></script>
</body>
</html>
