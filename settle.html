<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Codex">
<title>Settle</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="settle.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="settle full fit-screen beside">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon st-mark" aria-hidden="true"></span>Settle</button></h1>
    <div class="top-right"><button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button></div>
  </header>

  <div class="st-strip full-pull">
    <span id="stripA"></span>
    <span id="stripB"></span>
  </div>
  <section id="moulds" class="st-moulds" aria-label="The moulds to cast"></section>
  <section id="foundry" class="st-foundry fit-grow fit-box" aria-label="The crucibles"></section>

  <section class="st-side">
    <p id="line" class="st-line" aria-live="polite"></p>
    <div id="controls" class="st-controls">
      <button class="btn" type="button" id="undoBtn">Undo</button>
      <button class="btn" type="button" id="restartBtn">Restart</button>
      <button class="btn" type="button" id="hintBtn">Hint</button>
    </div>
    <div id="result" class="st-result" hidden>
      <p id="verdict" class="st-verdict"></p>
      <div class="st-btns"><button class="btn" type="button" id="againBtn">Play it again</button><button class="btn primary" type="button" id="nextBtn">Next level</button></div>
    </div>
  </section>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<script type="module" src="settle.js"></script>
</body>
</html>
