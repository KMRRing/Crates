<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almanac">
<title>Settle</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="settle.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="settle fit-screen beside">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon st-mark" aria-hidden="true"></span>Settle</button></h1>
    <div class="top-right"><button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button></div>
  </header>

  <div class="st-strip">
    <span class="st-score">Score <b id="score">0</b></span>
    <span id="lives" class="st-lives"></span>
    <span class="st-best">Best <b id="best">0</b></span>
  </div>
  <section id="farm" class="st-farm fit-grow fit-box" aria-label="The tank farm">
    <svg id="board" class="st-board" xmlns="http://www.w3.org/2000/svg" viewBox="-2 -14 74 87" role="img" aria-label="The tank farm"></svg>
  </section>

  <section class="st-side">
    <p id="line" class="st-line"></p>
    <div id="tray" class="st-tray">
      <button class="st-card" type="button" data-slot="0"></button>
      <button class="st-card" type="button" data-slot="1"></button>
      <button class="st-card st-draw" type="button" data-slot="draw" id="drawBtn"></button>
    </div>
    <div id="result" class="st-result" hidden>
      <p id="verdict" class="st-verdict"></p>
      <button class="st-go" type="button" id="againBtn">New game</button>
    </div>
  </section>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<p id="toast" class="st-toast" role="status" aria-live="polite"></p>
<script type="module" src="settle.js"></script>
</body>
</html>
