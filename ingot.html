<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Codex">
<title>Ingot</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="ingot.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="ingot full fit-screen beside">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon ig-mark" aria-hidden="true"></span>Ingot</button></h1>
    <div class="top-right"><button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button></div>
  </header>

  <div class="ig-strip full-pull">
    <span class="ig-score">Score <b id="score">0</b></span>
    <span class="ig-top">Top <b id="topBar">2</b></span>
    <span class="ig-best">Best <b id="best">0</b></span>
  </div>
  <section id="field" class="ig-field fit-grow fit-box" aria-label="The board">
    <div id="board" class="ig-board" role="application" aria-label="Four by four board of metal bars: swipe or use the arrow keys">
      <div class="ig-slots" id="slots"></div>
      <div class="ig-tiles" id="tiles"></div>
      <div class="ig-hint" id="hintArrow" hidden aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 15l7-7 7 7"/></svg></div>
    </div>
  </section>

  <section class="ig-side">
    <p id="line" class="ig-line"></p>
    <div id="tools" class="ig-tools">
      <button class="ig-tool" type="button" id="undoBtn">Undo <b id="undoLeft">3</b></button>
      <button class="ig-tool" type="button" id="hintBtn">Hint <b id="hintLeft">3</b></button>
    </div>
    <div id="result" class="ig-result" hidden>
      <p id="verdict" class="ig-verdict"></p>
      <button class="ig-go" type="button" id="againBtn">New game</button>
    </div>
  </section>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<p id="toast" class="ig-toast" role="status" aria-live="polite"></p>
<script type="module" src="ingot.js"></script>
<script type="module" src="sfx.js"></script>
</body>
</html>
