<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almanac">
<title>Nexus</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="duel.css">
<link rel="stylesheet" href="nexus.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="nexus fit-screen beside">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon nx-mark" aria-hidden="true"></span>Nexus</button></h1>
    <div class="top-right"><button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button></div>
  </header>
  <div class="nx-strip"><span id="where"></span><span id="rival" class="nx-rival" hidden></span><span id="score" class="nx-score"></span></div>
  <section class="nx-centre" id="centre" aria-live="polite">
    <p class="nx-label">Nexus</p>
    <h2 id="centreName"></h2>
    <p class="nx-kind" id="centreKind"></p>
    <p class="nx-ask" id="ask"></p>
  </section>
  <section class="nx-board fit-col fit-grow" id="board">
    <ul id="ring" class="nx-ring fit-scroll fit-grow" aria-label="Candidates"></ul>
  </section>
  <div class="nx-foot" id="foot">
    <p class="nx-verdict" id="verdict" hidden></p>
    <button class="nx-go" type="button" id="goBtn">Check</button>
  </div>
</div>
<dialog id="doneDlg" class="sheet" aria-label="How it went">
  <div class="pick-head"><h2 id="doneTitle">Run over</h2><button class="btn" type="button" id="doneClose">Close</button></div>
  <div id="doneBody"></div>
</dialog>
<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<p id="toast" class="nx-toast" role="status" aria-live="polite"></p>
<script type="module" src="nexus.js"></script>
</body>
</html>
