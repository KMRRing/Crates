<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almanac">
<title>Hitori</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="dropdown.css">
<link rel="stylesheet" href="duel.css">
<link rel="stylesheet" href="hitori.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="hitori fit-screen beside">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon hi-mark" aria-hidden="true"></span>Hitori</button></h1>
    <div class="top-right">
      <select id="level" class="pool" data-accent="hi" aria-label="Level">
        <option value="easy" data-note="What a mark beside it forces, pairs, sandwiches">Easy</option>
        <option value="medium" data-note="Keeping the board joined, too">Medium</option>
        <option value="hard" data-note="A short trial: suppose a cell, see it break">Hard</option>
        <option value="expert" data-note="A trial three rounds deep">Expert</option>
      </select>
      <button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button>
    </div>
  </header>

  <div class="hi-strip" id="strip">
    <span class="hi-time">Time <b id="time">0:00</b><small id="penalty"></small></span>
    <span class="hi-kind" id="kind"></span>
    <p id="rival" class="hi-rival" hidden></p>
    <p id="duelLine" class="hi-duel" hidden></p>
  </div>

  <section class="hi-card fit-grow fit-box" aria-label="The board">
    <div id="board" class="hi-board"></div>
  </section>

  <section class="hi-side">
    <div id="controls" class="hi-controls">
      <p id="line" class="hi-line" aria-live="polite"></p>
      <div class="hi-tools" role="group" aria-label="Tools">
        <button class="hi-tool" type="button" id="undoBtn"><b>Undo</b><small>the last mark</small></button>
        <button class="hi-tool" type="button" id="redoBtn"><b>Redo</b><small>it again</small></button>
        <button class="hi-tool" type="button" id="pointBtn" hidden aria-pressed="false"><b>Point</b><small>show a cell</small></button>
        <button class="hi-tool" type="button" id="hintBtn"><b>Hint</b><small>+30 s</small></button>
      </div>
    </div>
    <div id="result" class="hi-result" hidden>
      <p class="hi-verdict" id="verdict"></p>
      <button class="hi-go" type="button" id="nextBtn">Another puzzle</button>
    </div>
  </section>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<p id="toast" class="hi-toast" role="status" aria-live="polite"></p>
<script type="module" src="hitori.js"></script>
</body>
</html>
