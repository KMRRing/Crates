<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almanac">
<title>Arb</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="arb.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="arb fit-screen beside">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon ab-mark" aria-hidden="true"></span>Arb</button></h1>
    <div class="top-right"><button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button></div>
  </header>
  <div class="ab-strip"><span id="where"></span><span id="score" class="ab-score"></span></div>
  <section class="ab-route" id="route">
    <p class="ab-ends"><b id="from"></b><span class="ab-to" aria-hidden="true">→</span><b id="to"></b></p>
    <p class="ab-par" id="par"></p>
    <ol id="path" class="ab-path" aria-label="Your route so far"></ol>
  </section>
  <section class="ab-pick fit-col fit-grow" id="pick">
    <div class="ab-tools"><input id="filter" placeholder="Filter the links" aria-label="Filter the links" autocomplete="off" spellcheck="false"><button class="ab-quiet" type="button" id="backBtn">Back</button></div>
    <ul id="links" class="ab-links fit-scroll fit-grow" aria-label="Linked from here"></ul>
    <button class="link" type="button" id="giveBtn">Give up</button>
  </section>
  <section id="result" class="ab-result fit-col fit-grow" hidden>
    <p id="verdict" class="ab-verdict"></p>
    <p class="ab-note" id="note"></p>
    <ol id="parPath" class="ab-path par fit-scroll fit-grow" aria-label="The cheapest route"></ol>
    <button class="ab-go" type="button" id="nextBtn">Next</button>
  </section>
</div>
<dialog id="doneDlg" class="sheet" aria-label="How it went">
  <div class="pick-head"><h2 id="doneTitle">Run over</h2><button class="btn" type="button" id="doneClose">Close</button></div>
  <div id="doneBody"></div>
</dialog>
<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<p id="toast" class="ab-toast" role="status" aria-live="polite"></p>
<script type="module" src="arb.js"></script>
</body>
</html>
