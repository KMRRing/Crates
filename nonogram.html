<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Codex">
<title>Nonogram</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="dropdown.css">
<link rel="stylesheet" href="duel.css">
<link rel="stylesheet" href="nonogram.css">
<link rel="stylesheet" href="loom.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="nonogram full titled fit-screen beside">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon ng-mark" aria-hidden="true"></span>Nonogram</button></h1>
    <div class="top-right">
      <select id="size" class="pool" data-accent="ng" aria-label="Size">
        <option value="small" data-note="About 10 × 10 cells">Small</option>
        <option value="medium" data-note="About 15 × 15 cells">Medium</option>
        <option value="large" data-note="About 20 × 20: zoom in to draw">Large</option>
      </select>
      <button id="rulesBtn" class="pick" aria-haspopup="dialog">Rules</button>
      <button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button>
    </div>
  </header>

  <div class="ng-strip full-pull">
    <span class="ng-clock"><b id="clock">0:00</b><small id="penalty"></small></span>
    <span class="ng-what" id="what"></span>
    <span class="ng-drawn" id="drawn"></span>
    <span id="rival" class="ng-rival" hidden></span>
  </div>

  <section class="ng-card fit-grow" aria-label="The puzzle">
    <canvas id="board" class="ng-board"></canvas>
    <canvas id="hexBoard" class="ng-board" hidden></canvas>
    <button id="zoomBtn" class="ng-zoom" type="button" aria-label="Zoom in" hidden></button>
  </section>

  <section class="ng-side">
    <p id="line" class="ng-line" aria-live="polite"></p>
    <div id="controls" class="ng-controls">
      <div id="tools" class="ng-tools" role="group" aria-label="Draw with"></div>
      <div class="ng-acts">
        <button class="ng-act" type="button" id="undoBtn"><b>Undo</b></button>
        <button class="ng-act" type="button" id="redoBtn"><b>Redo</b></button>
        <button class="ng-act" type="button" id="hintBtn"><b>Hint</b><small>+30 s</small></button>
        <button class="ng-act" type="button" id="nameBtn"><b>Name it</b><small id="nameSmall"></small></button>
      </div>
    </div>
    <div id="result" class="ng-result" hidden>
      <p class="ng-verdict" id="verdict"></p>
      <button class="ng-go" type="button" id="nextBtn">Next picture</button>
    </div>
  </section>

  <!-- Cloth mode (it was Loom): shown instead of the picture's parts when the menu's Mode is Cloth; loom-mode.js fills it -->
  <div class="lm-strip full-pull">
    <span class="lm-job"><b id="clJobName"></b><small id="clJobNo"></small></span>
    <span class="lm-stars" id="clJobStars" aria-label="Your best for this job"></span>
  </div>
  <section id="clBench" class="lm-bench fit-grow" aria-label="The cloth you are weaving">
    <div id="clClothHost" class="lm-host"></div>
    <div id="clMarker" class="lm-marker" role="radiogroup" aria-label="What a touch does" hidden>
      <button type="button" class="lm-mode" role="radio" aria-checked="true" data-mode="lay" title="Lay floats: tap where a thread comes up and where it goes back under"><svg viewBox="0 0 16 16" aria-hidden="true" fill="currentColor"><rect x="5" y="1" width="6" height="14" rx="1"/></svg><span>Lay</span></button>
      <button type="button" class="lm-mode" role="radio" aria-checked="false" data-mode="warp" title="Pencil a warp where you think a thread comes up (a pencil note, never marked wrong)"><svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 2.5 C7.4 6 8.6 10 8 13.5"/></svg><span>Mark warp</span></button>
      <button type="button" class="lm-mode" role="radio" aria-checked="false" data-mode="weft" title="Pencil the weft you know stays over (a pencil note, never marked wrong)"><svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M2.5 8 C6 7.4 10 8.6 13.5 8"/></svg><span>Mark weft</span></button>
    </div>
  </section>
  <p id="clLine" class="lm-line" role="status" aria-live="polite"></p>
  <section class="lm-side">
    <div id="clActs" class="lm-acts"></div>
  </section>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<dialog id="rulesDlg" class="sheet ng-sheet" aria-label="Rules">
  <div class="pick-head"><h2>Rules</h2><button class="btn" type="button" id="rulesClose">Close</button></div>
  <div id="rulesBody" class="ng-rules"></div>
</dialog>

<dialog id="nameDlg" class="sheet menu-sheet ng-name" aria-label="Name it">
  <div class="pick-head"><h2 id="nameHead">Name it</h2><button class="icon-btn menu-x" type="button" id="nameClose" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="ng-name-body">
    <canvas id="namePic" class="ng-name-pic" aria-hidden="true"></canvas>
    <p id="nameAsk" class="ng-name-ask"></p>
    <form id="nameForm" class="ng-name-form" autocomplete="off">
      <input id="nameInput" type="text" enterkeyhint="go" autocapitalize="words" spellcheck="false" aria-label="The name">
      <button class="btn primary" type="submit" id="nameGo">Name it</button>
    </form>
    <ul id="nameList" class="ng-name-list" role="listbox" aria-label="Names"></ul>
    <p id="nameNote" class="ng-name-note"></p>
    <button class="link" type="button" id="nameSkip">I don't know</button>
  </div>
</dialog>

<dialog id="clDoneDlg" class="sheet lm-done" aria-labelledby="clDoneHead">
  <h2 id="clDoneHead"></h2>
  <p id="clDoneStars" class="lm-big-stars" aria-hidden="true"></p>
  <dl id="clDoneBody" class="lm-figures"></dl>
  <p id="clDoneNote" class="lm-note"></p>
  <div class="lm-done-go"><button class="btn" type="button" id="clAgainBtn">A fresh one</button><button class="btn primary" type="button" id="clNextBtn">Next cloth</button></div>
</dialog>

<p id="toast" class="ng-toast" role="status" aria-live="polite"></p>
<script>try { if (/[?&]mode=cloth\b/.test(location.search) || JSON.parse(localStorage.getItem("nonogram:settings")).mode === "cloth") document.getElementById("app").classList.add("cloth"); } catch (e) { /* the picture's, then */ }</script>
<script type="module" src="nonogram.js"></script>
</body>
</html>
