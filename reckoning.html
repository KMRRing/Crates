<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almanac">
<title>Reckoning</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="reckoning.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="reckoning fit-screen beside">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon rk-mark" aria-hidden="true"></span>Reckoning</button></h1>
    <div class="top-right"><button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button></div>
  </header>

  <section id="sky" class="rk-sky fit-grow fit-box" aria-label="The quay">
    <div id="stage" class="rk-stage">
      <div class="rk-hud">
        <span id="hearts" class="rk-hearts" role="img" aria-label="Hearts"></span>
        <span class="rk-score"><b id="score">0</b> m</span>
        <span id="combo" class="rk-combo" aria-live="polite"></span>
      </div>
      <p id="toast" class="rk-toast" aria-live="polite"></p>
      <p id="hint" class="rk-hint" aria-live="polite"></p>
    </div>
  </section>

  <section class="rk-side">
    <div id="ask" class="rk-ask">
      <p id="question" class="rk-q" aria-live="polite"></p>
      <div id="cards" class="rk-cards"><div class="rk-card"></div><div class="rk-card"></div><div class="rk-card"></div></div>
    </div>
    <div id="result" class="rk-result" hidden>
      <p id="verdict" class="rk-verdict"></p>
      <ul id="missed" class="rk-missed fit-scroll"></ul>
      <button class="rk-go" type="button" id="againBtn">New run</button>
    </div>
  </section>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<script type="module" src="reckoning.js"></script>
</body>
</html>
