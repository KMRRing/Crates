<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Codex">
<title>Spyglass</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="spyglass.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="spyglass full titled fit-screen beside">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon sg-mark" aria-hidden="true"></span>Spyglass</button></h1>
    <div class="top-right"><button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button></div>
  </header>
  <div class="sg-strip full-pull"><span id="where"></span><span id="score" class="sg-score"></span></div>
  <section class="sg-deal" id="deal">
    <p class="sg-ask" id="ask"></p>
    <p class="sg-worth" id="worth" aria-live="off"></p>
  </section>
  <div class="sg-lens fit-grow" id="lensBox"><canvas id="lens" aria-label="The picture, coming into focus"></canvas><p class="sg-caption" id="caption" hidden></p></div>
  <div class="sg-opts" id="opts"></div>
  <div class="sg-bar" id="bar">
    <button class="btn" type="button" id="passBtn">Pass</button>
    <button class="btn primary" type="button" id="nextBtn" hidden>Next</button>
  </div>
</div>
<dialog id="doneDlg" class="sheet" aria-label="How it went">
  <div class="pick-head"><h2 id="doneTitle">Run over</h2><button class="btn" type="button" id="doneClose">Close</button></div>
  <div id="doneBody"></div>
</dialog>
<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>
<script type="module" src="spyglass.js"></script>
<script type="module" src="sfx.js"></script>
</body>
</html>
