<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almanac">
<title>Codeword</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="dropdown.css">
<link rel="stylesheet" href="duel.css">
<link rel="stylesheet" href="codeword.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="codeword fit-screen beside">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon cw-mark" aria-hidden="true"></span>Codeword</button></h1>
    <div class="top-right">
      <select id="level" class="pool" data-accent="cw" aria-label="Level">
        <option value="easy" data-note="Four letters given; never more than four words to weigh">Easy</option>
        <option value="medium" data-note="Three letters given; up to eight words to weigh">Medium</option>
        <option value="hard" data-note="Two letters given; sixteen or more somewhere">Hard</option>
        <option value="expert" data-note="One letter given; thirty or more to weigh">Expert</option>
      </select>
      <button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button>
    </div>
  </header>

  <div class="cw-strip">
    <span class="cw-time"><b id="clock">0:00</b></span>
    <span id="found" class="cw-found"></span>
    <span class="cw-tools" role="group" aria-label="Tools">
      <button id="undoBtn" class="cw-tool" type="button" aria-label="Undo">Undo</button>
      <button id="hintBtn" class="cw-tool" type="button" aria-label="Hint, thirty seconds">Hint</button>
      <button id="checkBtn" class="cw-tool" type="button" aria-label="Check, twenty seconds">Check</button>
    </span>
    <span id="rival" class="cw-rival" hidden></span>
    <span id="others" class="cw-rival" hidden></span>
  </div>

  <section id="boardBox" class="cw-boardbox fit-grow fit-box" aria-label="The grid">
    <div id="board" class="cw-board" role="grid"></div>
  </section>

  <section class="cw-side">
    <div id="keytable" class="cw-keytable" role="group" aria-label="The key: each number's letter"></div>
    <p id="line" class="cw-line" aria-live="polite"></p>
    <div id="mystery" class="cw-mystery" hidden></div>
    <div id="result" class="cw-result" hidden>
      <p id="verdict" class="cw-verdict"></p>
      <button id="nextBtn" class="cw-go" type="button">Another grid</button>
    </div>
    <div id="kbd" class="cw-kbd" aria-label="Letters"></div>
  </section>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<p id="toast" class="cw-toast" role="status" aria-live="polite"></p>
<script type="module" src="codeword.js"></script>
</body>
</html>
