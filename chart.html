<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almanac">
<title>Chart</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="dropdown.css">
<link rel="stylesheet" href="chart.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="chart fit-screen">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon ch-mark" aria-hidden="true"></span>Chart</button></h1>
    <div class="top-right"><button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button></div>
  </header>

  <p id="partner" class="ch-partner" hidden></p>
  <div class="ch-strip">
    <div class="ch-pick">
      <select id="topic" class="pool" aria-label="Topic" data-accent="ch">
        <option value="all">Everything</option><option value="cities">Cities</option><option value="countries">Countries</option>
        <option value="commodities">Commodities</option><option value="nature">Nature</option><option value="culture">Culture</option>
      </select>
      <select id="region" class="pool" aria-label="Region" data-accent="ch"></select>
    </div>
    <span id="scores" class="ch-score"><b id="score">0</b></span>
  </div>

  <section class="ch-card fit-col fit-grow">
    <div class="ch-card-top"><span id="cat" class="ch-cat"></span><span id="where" class="ch-where"></span></div>
    <h2 id="place" class="ch-place"></h2>
    <div id="picture" class="ch-picture" hidden></div>
    <p id="hint" class="ch-hint">Tap to place the pin. Drag to pan, pinch to zoom.</p>
    <div class="ch-maps fit-box fit-grow">
      <canvas id="world" class="ch-map" aria-label="The world"></canvas>
    </div>
    <div class="ch-bottom">
    <ul id="clues" class="ch-clues fit-scroll"></ul>
    <div class="ch-actions two">
      <button class="ch-go quiet" type="button" id="clueBtn">A clue</button>
      <button class="ch-go" type="button" id="pinBtn" disabled>Pin it</button>
    </div>
    <div id="result" class="ch-result" hidden>
      <p class="ch-verdict" id="verdict"></p>
      <p class="ch-note fit-scroll" id="note"></p>
      <button class="ch-go" type="button" id="nextBtn">Next</button>
    </div>
    </div>
  </section>
</div>

<dialog id="doneDlg" class="sheet" aria-label="How it went">
  <div class="pick-head"><h2>The set</h2><button class="btn" type="button" id="doneClose">Close</button></div>
  <div id="doneBody"></div>
</dialog>

<dialog id="nameDlg" class="sheet" aria-label="Your name">
  <form method="dialog" id="nameForm">
    <label for="nameInput">Your name, so your partner knows who's playing</label>
    <input id="nameInput" maxlength="16" autocomplete="nickname" required>
    <button class="btn primary wide" type="submit">Continue</button>
  </form>
</dialog>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<p id="toast" class="ch-toast" role="status" aria-live="polite"></p>
<script type="module" src="chart.js"></script>
</body>
</html>
