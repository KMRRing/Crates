<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Codex">
<title>Constitutions and institutions</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="course.css">
<link rel="stylesheet" href="lesson-kit.css">
<link rel="stylesheet" href="constitutions.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="constitutions full titled fit-screen wide">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon cn-mark" aria-hidden="true"></span>Constitutions</button></h1>
    <div class="top-right"><button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button></div>
  </header>
  <p class="cn-status full-pull" id="status"></p>

  <section class="cn-home fit-col fit-grow">
    <div class="cn-plate fit-half" aria-hidden="true"><svg viewBox="0 0 300 220" id="plate" class="cn"></svg></div>
    <div class="cn-about fit-half">
      <p class="cn-intro"></p>
      <div class="cn-meter" aria-hidden="true"><i id="meter"></i></div>
      <button class="cn-go" type="button" id="goBtn">Start</button>
      <button class="cn-link" type="button" id="mapBtn">All the lessons</button>
      <button class="cn-link" type="button" id="reviewBtn" hidden>Review</button>
      <p class="cn-fine">Facts about how power is organised, not advocacy. Dated facts carry their source.</p>
    </div>
  </section>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<script type="module" src="constitutions.js"></script>
</body>
</html>
