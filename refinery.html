<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almanac">
<title>Refinery</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="dropdown.css">
<link rel="stylesheet" href="duel.css">
<link rel="stylesheet" href="refinery.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="refinery fit-screen beside">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon rf-mark" aria-hidden="true"></span>Refinery</button></h1>
    <div class="top-right"><button id="courseBtn" class="pick" aria-haspopup="dialog">Course</button><button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button></div>
  </header>
  <div class="rf-strip"><span id="where"></span><span id="stars" class="rf-stars"></span></div>
  <section class="rf-brief">
    <p id="task" class="rf-task"></p>
    <div id="crudePick" class="rf-crude" hidden></div>
    <div class="rf-help"><button id="lessonBtn" class="rf-link" type="button">Lesson</button><button id="hintBtn" class="rf-link" type="button">Hint</button><button id="testBtn" class="rf-link" type="button" hidden>Exam</button><button id="undoBtn" class="rf-link" type="button" disabled>Undo</button></div>
    <p id="hint" class="rf-hint" hidden></p>
  </section>
  <section class="rf-margin">
    <div class="rf-margin-row"><span>Margin</span><b id="margin"></b><small id="par"></small></div>
    <div class="rf-bar"><i id="marginBar"></i><em id="parTick"></em></div>
    <p class="rf-rival" id="rival" hidden></p>
    <div class="rf-buttons"><p id="verdict" class="rf-verdict"></p><button class="rf-go" type="button" id="nextBtn" hidden>Next</button></div>
  </section>
  <div id="stage" class="rf-stage fit-grow">
    <svg id="sheet" class="rf-sheet" role="img" aria-label="The refinery's flowsheet: tap an arrow to send a stream elsewhere, a unit or a product for its card; drag to move, pinch to zoom"></svg>
    <div class="rf-zoom"><button type="button" id="zoomIn" aria-label="Zoom in">+</button><button type="button" id="zoomOut" aria-label="Zoom out">−</button><button type="button" id="zoomFit" aria-label="The whole plant">⤢</button></div>
    <p id="issue" class="rf-issue" hidden></p>
  </div>
  <select id="level" class="rf-level-select" aria-label="Level" hidden></select>
</div>

<dialog id="splitDlg" class="sheet rf-split" aria-labelledby="splitTitle">
  <div class="pick-head"><h2 id="splitTitle"></h2><button class="btn" type="button" id="splitClose">Close</button></div>
  <p id="splitMeta" class="rf-split-meta"></p>
  <div id="splitBar" class="rf-split-bar" aria-hidden="true"></div>
  <div id="splitRows" class="rf-split-rows"></div>
  <p id="splitMargin" class="rf-split-margin"></p>
</dialog>

<dialog id="cardDlg" class="sheet rf-scrolls" aria-labelledby="cardTitle">
  <div class="pick-head"><h2 id="cardTitle"></h2><button class="btn" type="button" id="cardClose">Close</button></div>
  <div id="cardBody" class="rf-card"></div>
</dialog>

<dialog id="lessonDlg" class="sheet rf-lesson" aria-labelledby="lessonTitle">
  <div class="pick-head"><h2 id="lessonTitle">Lesson</h2><button class="btn" type="button" id="lessonClose">Close</button></div>
  <div class="rf-steps"><div id="lessonDots" class="rf-dots" aria-label="Steps"></div><span id="lessonCount" class="rf-count"></span></div>
  <svg id="lessonScene" class="rf-scene" role="img" aria-label="The picture for this step"></svg>
  <div id="lessonSay" class="rf-say"></div>
  <div class="rf-nav"><button class="btn" type="button" id="lessonBack">Back</button><button class="btn primary" type="button" id="lessonNext">Next</button></div>
</dialog>

<dialog id="testDlg" class="sheet rf-test" aria-labelledby="testTitle">
  <div class="pick-head"><h2 id="testTitle">Exam</h2><button class="btn" type="button" id="testClose">Close</button></div>
  <div class="rf-steps"><div id="testDots" class="rf-dots rf-qdots" aria-hidden="true"></div><span id="testCount" class="rf-count"></span></div>
  <div id="testBody" class="rf-test-body">
    <svg id="testScene" class="rf-scene rf-test-scene" role="img" aria-label="The picture the question is about"></svg>
    <p id="testAsk" class="rf-ask"></p>
    <div id="testAnswer" class="rf-answer"></div>
    <p id="testSays" class="rf-says" aria-live="polite"></p>
  </div>
  <div class="rf-nav"><button class="btn" type="button" id="testAlt" hidden>Again</button><button class="btn primary" type="button" id="testNext">Next</button></div>
</dialog>

<dialog id="courseDlg" class="sheet rf-scrolls" aria-label="Course">
  <div class="pick-head"><h2>Course</h2><button class="btn" type="button" id="courseClose">Close</button></div>
  <div id="courseBody" class="rf-course"></div>
</dialog>

<dialog id="glossDlg" class="sheet rf-scrolls" aria-label="Glossary">
  <div class="pick-head"><h2>Glossary</h2><button class="btn" type="button" id="glossClose">Close</button></div>
  <div id="glossBody" class="rf-gloss"></div>
</dialog>

<dialog id="doneDlg" class="sheet" aria-labelledby="doneTitle">
  <div class="pick-head"><h2 id="doneTitle">At par</h2><button class="btn" type="button" id="doneClose">Close</button></div>
  <div id="doneBody" class="rf-done"></div>
</dialog>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<p id="toast" class="rf-toast" role="status" aria-live="polite"></p>
<script type="module" src="refinery.js"></script>
</body>
</html>
