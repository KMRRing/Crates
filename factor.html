<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almanac">
<title>Factor</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="factor.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="factor fit-screen beside">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon fc-mark" aria-hidden="true"></span>Factor</button></h1>
    <div class="top-right">
      <button id="rulesBtn" class="pick" aria-haspopup="dialog">Rules</button>
      <button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button>
    </div>
  </header>

  <section id="seats" class="fc-seats" aria-label="The players"></section>
  <p id="strip" class="fc-strip" role="status" aria-live="polite"></p>
  <section id="board" class="fc-board fit-grow" aria-label="The island"></section>
  <section id="side" class="fc-side" aria-label="Your hand">
    <div id="costs" class="fc-ref" aria-label="What things cost"></div>
    <div id="hand" class="fc-hand"></div>
    <div id="bar" class="fc-bar"></div>
  </section>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<dialog id="rulesDlg" class="sheet fc-sheet" aria-label="Rules">
  <div class="pick-head"><h2>Factor on one page</h2><button class="btn" type="button" id="rulesClose">Close</button></div>
  <div id="rulesBody" class="fc-rules"></div>
</dialog>

<dialog id="tradeDlg" class="sheet fc-sheet" aria-label="Trade">
  <div class="pick-head"><h2>Trade</h2><button class="btn" type="button" id="tradeClose">Close</button></div>
  <div id="tradeBody" class="fc-trade"></div>
</dialog>

<dialog id="cardsDlg" class="sheet fc-sheet" aria-label="Your cards">
  <div class="pick-head"><h2>Your cards</h2><button class="btn" type="button" id="cardsClose">Close</button></div>
  <div id="cardsBody" class="fc-cards"></div>
</dialog>

<dialog id="endDlg" class="sheet fc-sheet" aria-labelledby="endHead">
  <h2 id="endHead" class="fc-end-head"></h2>
  <div id="endBody" class="fc-end"></div>
  <div class="fc-end-go"><button class="btn" type="button" id="endTable">The island</button><button class="btn primary" type="button" id="endAgain">New game</button></div>
</dialog>

<p id="toast" class="fc-toast" role="status" aria-live="polite"></p>
<script type="module" src="factor.js"></script>
</body>
</html>
