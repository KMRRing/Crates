<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almanac">
<title>Shunt</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="shunt.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="shunt fit-screen beside">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon sh-mark" aria-hidden="true"></span>Shunt</button></h1>
    <div class="top-right"><button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button></div>
  </header>

  <div class="sh-strip">
    <span class="sh-score">Score <b id="score">0</b></span>
    <span id="lives" class="sh-lives"></span>
    <span class="sh-best">Best <b id="best">0</b></span>
  </div>
  <section id="yard" class="sh-yard fit-grow fit-box" aria-label="The yard">
    <svg id="board" class="sh-board" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 78 78" role="img" aria-label="The yard"></svg>
  </section>

  <section class="sh-side">
    <div id="tray" class="sh-tray">
      <div class="sh-coming" id="coming" aria-label="The wagon coming, and the next"></div>
      <p id="line" class="sh-line"></p>
    </div>
    <div id="result" class="sh-result" hidden>
      <p id="verdict" class="sh-verdict"></p>
      <button class="sh-go" type="button" id="againBtn">New game</button>
    </div>
  </section>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<p id="toast" class="sh-toast" role="status" aria-live="polite"></p>
<script type="module" src="shunt.js"></script>
</body>
</html>
