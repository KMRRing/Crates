<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Codex">
<title>Jam</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="campaign.css">
<link rel="stylesheet" href="shunt.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="shunt full titled fit-screen beside">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon sh-mark" aria-hidden="true"></span>Jam</button></h1>
    <div class="top-right"><button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button></div>
  </header>

  <!-- where you are and what is asked: the plate's name, its goal as chips, your longest trains and the stars -->
  <div class="sh-head">
    <div class="sh-line1"><span id="plateName" class="sh-name"></span><span class="sh-sc">Trains <b id="trains">–</b><span id="stars" class="sh-stars" aria-label="Stars"></span></span></div>
    <div id="goal" class="sh-aim" aria-label="Goal"></div>
  </div>
  <section id="plate" class="sh-plate fit-grow fit-box" aria-label="The plate">
    <svg id="board" class="sh-board" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The plate: nineteen cells and thirty levers round it"></svg>
  </section>

  <section class="sh-side">
    <p id="coach" class="sh-coach" aria-live="polite"></p>
    <svg id="tray" class="sh-tray" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The gears coming, and the hold"></svg>
    <div class="sh-acts">
      <button id="undoBtn" class="sh-btn" type="button">Undo</button>
      <button id="hintBtn" class="sh-btn" type="button">Hint</button>
      <button id="swapBtn" class="sh-btn" type="button">Swap</button>
      <button id="shoveBtn" class="sh-btn plate" type="button">Shove</button>
    </div>
  </section>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<p id="toast" class="sh-toast" role="status" aria-live="polite"></p>
<script type="module" src="shunt.js"></script>
</body>
</html>
