<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almanac">
<title>Lexicon</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="lexicon.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="lexicon fit-screen">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon lx-mark" aria-hidden="true"></span>Lexicon</button></h1>
    <div class="top-right"><button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button></div>
  </header>
  <form id="searchForm" class="lx-search" role="search" autocomplete="off">
    <input id="q" type="search" placeholder="Search anything: a country, a company, a painting…" aria-label="Search the lexicon" spellcheck="false" autocapitalize="off">
  </form>
  <section id="results" class="lx-results fit-scroll fit-grow" aria-label="Results"></section>
  <article id="entry" class="lx-entry fit-scroll fit-grow" hidden></article>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<p id="toast" class="lx-toast" role="status" aria-live="polite"></p>
<script type="module" src="lexicon.js"></script>
</body>
</html>
