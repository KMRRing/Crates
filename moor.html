<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Codex">
<title>Moor</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="moor.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="moor full titled fit-screen beside">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon mr-mark" aria-hidden="true"></span>Moor</button></h1>
    <div class="top-right">
      <button id="rulesBtn" class="pick" aria-haspopup="dialog">Rules</button>
      <button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button>
    </div>
  </header>

  <div class="mr-strip full-pull" id="strip">
    <span class="mr-time">Time <b id="time">0:00</b><small id="penalty"></small></span>
    <span class="mr-kind" id="kind"></span>
  </div>

  <section class="mr-card fit-grow fit-box" id="card" aria-label="The board">
    <div id="board" class="mr-board"></div>
    <div id="model" class="mr-model" role="img" aria-label="The harbour in 3D: tap a berth to moor a barge, again for open water, drag along a row to mark open water, drag the sea or use Move to turn the view, pinch to zoom" hidden></div>
  </section>

  <section class="mr-side">
    <div id="controls" class="mr-controls">
      <p id="line" class="mr-say" aria-live="polite"></p>
      <div class="mr-tools" role="group" aria-label="Tools">
        <button class="mr-tool" type="button" id="undoBtn"><b>Undo</b><small>the last mark</small></button>
        <button class="mr-tool" type="button" id="redoBtn"><b>Redo</b><small>it again</small></button>
        <button class="mr-tool" type="button" id="hintBtn"><b>Hint</b><small>+30 s</small></button>
        <button class="mr-tool" type="button" id="viewBtn" aria-pressed="false"><b>3D</b><small>the harbour</small></button>
      </div>
    </div>
    <div id="result" class="mr-result" hidden>
      <p class="mr-verdict" id="verdict"></p>
      <button class="mr-go" type="button" id="nextBtn">Another puzzle</button>
    </div>
  </section>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<dialog id="rulesDlg" class="sheet mr-sheet" aria-label="Rules">
  <div class="pick-head"><h2>Rules</h2><button class="btn" type="button" id="rulesClose">Close</button></div>
  <div id="rulesBody" class="mr-rules"></div>
</dialog>

<p id="toast" class="mr-toast" role="status" aria-live="polite"></p>
<script type="module" src="moor.js"></script>
</body>
</html>
