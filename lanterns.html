<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Codex">
<title>Lanterns</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="lanterns.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="lanterns full titled fit-screen beside">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon lan-mark" aria-hidden="true"></span>Lanterns</button></h1>
    <div class="top-right">
      <button id="rulesBtn" class="pick" aria-haspopup="dialog">Rules</button>
      <button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button>
    </div>
  </header>

  <div class="lan-strip full-pull" id="strip">
    <span class="lan-time">Time <b id="time">0:00</b><small id="penalty"></small></span>
    <span class="lan-kind" id="kind"></span>
  </div>

  <section class="lan-card fit-grow fit-box" id="card" aria-label="The board">
    <div id="board" class="lan-board"></div>
    <div id="model" class="lan-model" role="img" aria-label="The board in 3D: tap a shoal to raise a lighthouse, hold to mark it with a buoy, drag to turn the board, pinch to zoom" hidden></div>
  </section>

  <section class="lan-side">
    <div id="controls" class="lan-controls">
      <p id="line" class="lan-say" aria-live="polite"></p>
      <div class="lan-tools" role="group" aria-label="Tools">
        <button class="lan-tool" type="button" id="undoBtn"><b>Undo</b><small>last mark</small></button>
        <button class="lan-tool" type="button" id="redoBtn"><b>Redo</b><small>again</small></button>
        <button class="lan-tool" type="button" id="hintBtn"><b>Hint</b><small>+30 s</small></button>
        <button class="lan-tool" type="button" id="viewBtn" aria-pressed="false"><b>3D</b><small>the sea</small></button>
      </div>
    </div>
    <div id="result" class="lan-result" hidden>
      <p class="lan-verdict" id="verdict"></p>
      <button class="lan-go" type="button" id="nextBtn">Another puzzle</button>
    </div>
  </section>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<dialog id="rulesDlg" class="sheet lan-sheet" aria-label="Rules">
  <div class="pick-head"><h2>Rules</h2><button class="btn" type="button" id="rulesClose">Close</button></div>
  <div id="rulesBody" class="lan-rules"></div>
</dialog>

<p id="toast" class="lan-toast" role="status" aria-live="polite"></p>
<script type="module" src="lanterns.js"></script>
<script type="module" src="sfx.js"></script>
</body>
</html>
