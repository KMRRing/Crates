<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Codex">
<title>Four in a row</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="course.css">
<link rel="stylesheet" href="silo.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="silo full fit-screen beside">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon si-mark" aria-hidden="true"></span>Four in a row</button></h1>
    <div class="top-right">
      <button id="learnBtn" class="pick" aria-haspopup="dialog">Learn</button>
      <button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button>
    </div>
  </header>

  <div id="them" class="si-seat them"></div>
  <div id="board" class="si-board fit-grow" aria-label="The board"></div>
  <div id="mine" class="si-seat mine"></div>
  <p id="status" class="si-status" aria-live="polite"></p>
  <p id="coach" class="si-coach" aria-live="polite" hidden></p>
  <div id="controls" class="si-controls"></div>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<dialog id="rulesDlg" class="sheet si-sheet" aria-label="Rules">
  <div class="pick-head"><h2>Rules</h2><button class="btn" type="button" id="rulesClose">Close</button></div>
  <div id="rulesBody" class="si-rules"></div>
</dialog>

<p id="toast" class="si-toast" role="status" aria-live="polite"></p>
<script type="module" src="silo.js"></script>
</body>
</html>
