<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Codex">
<title>Odds</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="course.css">
<link rel="stylesheet" href="odds.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="odds full titled fit-screen wide">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon od-mark" aria-hidden="true"></span>Odds</button></h1>
    <div class="top-right">
      <button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button>
    </div>
  </header>

  <section id="home" class="od-home fit-col fit-grow">
    <div class="od-about fit-half">
      <p class="od-intro">Probability, expected value, base rates and Bayes, fair prices, Kelly sizing, calibration and judgement. Nineteen short lessons on dice, cards, urns, markets and estimates; every figure is worked out by the page, not typed.</p>
      <div class="od-stats" id="stats"></div>
      <button class="od-go" type="button" id="goBtn">Start the course</button>
    </div>
    <div class="od-record fit-half">
      <h3 class="od-h">Your calibration</h3>
      <div class="od-recfig fit-grow" id="record"></div>
      <p class="od-recnote" id="recNote"></p>
    </div>
  </section>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<script type="module" src="odds.js"></script>
</body>
</html>
