<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Codex">
<title>Asterism</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="asterism.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="asterism full titled fit-screen beside">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon ast-mark" aria-hidden="true"></span>Asterism</button></h1>
    <div class="top-right">
      <button id="rulesBtn" class="pick" aria-haspopup="dialog">Rules</button>
      <button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button>
    </div>
  </header>

  <div class="ast-strip full-pull" id="strip">
    <span class="ast-time">Time <b id="time">0:00</b><small id="penalty"></small></span>
    <span class="ast-kind" id="kind"></span>
  </div>

  <section class="ast-card fit-grow fit-box" aria-label="The board">
    <div id="board" class="ast-board"></div>
  </section>

  <section class="ast-side">
    <div id="controls" class="ast-controls">
      <p id="line" class="ast-say" aria-live="polite"></p>
      <div class="ast-tools" role="group" aria-label="Tools">
        <button class="ast-tool" type="button" id="undoBtn"><b>Undo</b><small>the last mark</small></button>
        <button class="ast-tool" type="button" id="redoBtn"><b>Redo</b><small>it again</small></button>
        <button class="ast-tool" type="button" id="hintBtn"><b>Hint</b><small>+30 s</small></button>
      </div>
    </div>
    <div id="result" class="ast-result" hidden>
      <p class="ast-verdict" id="verdict"></p>
      <button class="ast-go" type="button" id="nextBtn">Another puzzle</button>
    </div>
  </section>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<dialog id="rulesDlg" class="sheet ast-sheet" aria-label="Rules">
  <div class="pick-head"><h2>Rules</h2><button class="btn" type="button" id="rulesClose">Close</button></div>
  <div id="rulesBody" class="ast-rules"></div>
</dialog>

<p id="toast" class="ast-toast" role="status" aria-live="polite"></p>
<script type="module" src="asterism.js"></script>
<script type="module" src="sfx.js"></script>
</body>
</html>
