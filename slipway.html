<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almanac">
<title>Slipway</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="slipway.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="slipway fit-screen beside">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon sw-mark" aria-hidden="true"></span>Slipway</button></h1>
    <div class="top-right"><button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button></div>
  </header>

  <div class="sw-strip">
    <span class="sw-score">Score <b id="score">0</b></span>
    <span class="sw-ships">Launched <b id="ships">0</b></span>
    <span class="sw-best">Best <b id="best">0</b></span>
  </div>
  <section id="field" class="sw-field fit-grow fit-box" aria-label="The yard">
    <svg id="flat" class="sw-flat" viewBox="-3.6 -3.9 7.2 11.2" role="img" aria-label="The yard" hidden></svg>
    <div id="fx" class="sw-fx" aria-hidden="true"></div>
  </section>
  <p id="line" class="sw-line" role="status" aria-live="polite"></p>
  <section class="sw-side">
    <div id="needs" class="sw-needs" aria-label="What she still needs"></div>
    <div id="result" class="sw-result" hidden>
      <p id="verdict" class="sw-verdict"></p>
      <button class="sw-go" type="button" id="againBtn">New game</button>
    </div>
  </section>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<p id="toast" class="sw-toast" role="status" aria-live="polite"></p>
<script type="module" src="slipway.js"></script>
</body>
</html>
