<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Codex">
<title>Slipway</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="slipway.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="slipway full titled fit-screen beside">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon sw-mark" aria-hidden="true"></span>Slipway</button></h1>
    <div class="top-right"><button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button></div>
  </header>

  <div class="sw-strip full-pull"><span id="where"></span><span id="clock" class="sw-clock"></span></div>
  <section id="bench" class="sw-bench fit-grow" aria-label="The timber, turn it by dragging">
    <canvas id="cube" class="sw-cube"></canvas>
  </section>
  <section id="layers" class="sw-layers" aria-label="The timber in layers, lowest first"></section>
  <section class="sw-hand">
    <canvas id="hand" class="sw-handview" aria-label="The figure in your hand"></canvas>
    <div class="sw-turns" role="group" aria-label="Turn the figure">
      <button class="btn" type="button" data-axis="0">Turn x</button>
      <button class="btn" type="button" data-axis="1">Turn y</button>
      <button class="btn" type="button" data-axis="2">Turn z</button>
    </div>
  </section>
  <section id="tray" class="sw-tray" role="group" aria-label="The figures still to fit"></section>
  <div class="sw-bar">
    <button class="btn" type="button" id="hintBtn">Show one</button>
    <button class="btn" type="button" id="undoBtn">Undo</button>
    <button class="btn primary" type="button" id="placeBtn">Place</button>
  </div>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<dialog id="doneDlg" class="sheet" aria-labelledby="doneHead">
  <div class="pick-head"><h2 id="doneHead">Fitted</h2><button class="btn" type="button" id="doneClose">Close</button></div>
  <div id="doneBody"></div>
</dialog>

<p id="toast" class="sw-toast" role="status" aria-live="polite"></p>
<script type="module" src="slipway.js"></script>
</body>
</html>
