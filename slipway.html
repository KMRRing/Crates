<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almanac">
<title>Slipway</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="slipway.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="slipway fit-screen beside">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon sw-mark" aria-hidden="true"></span>Slipway</button></h1>
    <div class="top-right"><button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button></div>
  </header>

  <div class="sw-strip">
    <span class="sw-part"><b id="partName"></b><small id="partNo"></small></span>
    <span class="sw-stars" id="partStars" aria-label="Your best for this part"></span>
  </div>
  <section id="bench" class="sw-bench fit-grow" aria-label="The workbench">
    <svg id="over" class="sw-over" aria-hidden="true"></svg>
    <p id="nogl" class="sw-nogl" hidden>Slipway carves in 3D, and this device can't draw it.</p>
  </section>
  <p id="line" class="sw-line" role="status" aria-live="polite"></p>
  <section class="sw-side">
    <div id="tools" class="sw-tools" role="toolbar" aria-label="Tools"></div>
    <div id="acts" class="sw-acts"></div>
  </section>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<dialog id="doneDlg" class="sheet sw-done" aria-labelledby="doneHead">
  <h2 id="doneHead"></h2>
  <p id="doneStars" class="sw-big-stars" aria-hidden="true"></p>
  <dl id="doneBody" class="sw-figures"></dl>
  <p id="doneNote" class="sw-note"></p>
  <div class="sw-done-go"><button class="btn" type="button" id="againBtn">Carve it again</button><button class="btn primary" type="button" id="nextBtn">Next part</button></div>
</dialog>

<p id="toast" class="sw-toast" role="status" aria-live="polite"></p>
<script type="module" src="slipway.js"></script>
</body>
</html>
