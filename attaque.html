<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Codex">
<title>L'Attaque</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="course.css">
<link rel="stylesheet" href="attaque.css">
<link rel="stylesheet" href="attaque-3d.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="attaque full fit-screen beside">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon at-mark" aria-hidden="true"></span>L'Attaque</button></h1>
    <div class="top-right">
      <button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button>
    </div>
  </header>

  <p id="status" class="at-status full-pull" aria-live="polite"></p>
  <section id="table" class="at-table fit-grow" aria-label="The board">
    <div id="far" class="at-seat far"></div>
    <div id="stage" class="at-stage"><div id="board" class="at-board"></div><div id="board3" class="at-board3"></div>
      <div id="clash" class="at-clash" aria-hidden="true"></div>
      <button id="cover" class="at-cover" type="button" hidden></button>
    </div>
    <div id="near" class="at-seat near"></div>
  </section>
  <section id="side" class="at-side" aria-label="The game">
    <div id="roster" class="at-roster" aria-label="Their army left"></div>
    <div id="controls" class="at-controls"></div>
  </section>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<dialog id="rulesDlg" class="sheet at-sheet" aria-label="Rules">
  <div class="pick-head"><h2>Rules</h2><button class="btn" type="button" id="rulesClose">Close</button></div>
  <div id="rulesBody" class="at-rules"></div>
</dialog>

<dialog id="endDlg" class="sheet at-sheet" aria-labelledby="endHead">
  <h2 id="endHead" class="at-end-head"></h2>
  <div id="endBody" class="at-end"></div>
  <div class="at-end-go"><button class="btn" type="button" id="endBoard">The board</button><button class="btn primary" type="button" id="endAgain">New game</button></div>
</dialog>

<p id="toast" class="at-toast" role="status" aria-live="polite"></p>
<script type="module" src="attaque.js"></script>
<script type="module" src="sfx.js"></script>
</body>
</html>
