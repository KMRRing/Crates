<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Codex">
<title>Wine</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="course.css">
<link rel="stylesheet" href="wine.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="wine full titled fit-screen wide">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon wn-mark" aria-hidden="true"></span>Wine</button></h1>
    <div class="top-right"><button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button></div>
  </header>
  <p class="wn-status full-pull" id="status"></p>

  <section class="wn-home fit-col fit-grow">
    <div class="wn-plate fit-half" aria-hidden="true"><svg viewBox="0 0 300 220" id="plate" class="wn"></svg></div>
    <div class="wn-about fit-half">
      <p class="wn-intro"></p>
      <div class="wn-meter" aria-hidden="true"><i id="meter"></i></div>
      <button class="wn-go" type="button" id="goBtn">Start</button>
      <button class="wn-link" type="button" id="mapBtn">All the lessons</button>
    </div>
  </section>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<script type="module" src="wine.js"></script>
<script type="module" src="sfx.js"></script>
</body>
</html>
