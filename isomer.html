<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almanac">
<title>Isomer</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="duel.css">
<link rel="stylesheet" href="isomer.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="isomer fit-screen beside">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon is-mark" aria-hidden="true"></span>Isomer</button></h1>
    <div class="top-right"><button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button></div>
  </header>

  <div class="is-strip">
    <span class="is-time">Time <b id="time">0:00</b><small id="penalty"></small></span>
    <span id="where" class="is-where"></span>
    <span id="ghost" class="is-ghost" hidden></span>
    <span id="rival" class="is-rival" hidden></span>
  </div>

  <section id="board" class="is-board fit-grow" aria-label="The jumbles and the answer"></section>

  <section class="is-side">
    <div id="clue" class="is-clue" aria-live="polite"></div>
    <div id="work" class="is-work">
      <div id="rack" class="is-rack" role="group" aria-label="Letters to place"></div>
      <div class="is-tools">
        <button class="is-tool" type="button" id="shuffleBtn"><b>Shuffle</b></button>
        <button class="is-tool" type="button" id="clearBtn"><b>Clear</b></button>
        <button class="is-tool" type="button" id="backBtn" aria-label="Take back the last letter"><b>⌫</b></button>
        <button class="is-tool" type="button" id="hintBtn"><b>Hint</b><small>+15 s</small></button>
      </div>
    </div>
    <div id="result" class="is-result" hidden>
      <p id="verdict" class="is-verdict"></p>
      <button class="is-go" type="button" id="nextBtn">Another</button>
    </div>
  </section>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>
<dialog id="nameDlg" class="sheet" aria-label="Your name">
  <form method="dialog">
    <label for="nameInput">Your name, so the others know who's playing</label>
    <input id="nameInput" maxlength="16" autocomplete="nickname" required>
    <button class="btn primary wide" type="submit">Continue</button>
  </form>
</dialog>

<p id="toast" class="is-toast" role="status" aria-live="polite"></p>
<script src="bank.js"></script>
<script type="module" src="isomer.js"></script>
</body>
</html>
