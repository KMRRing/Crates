<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almanac">
<title>Rosette</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="rosette.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="rosette fit-screen beside">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon ro-mark" aria-hidden="true"></span>Rosette</button></h1>
    <div class="top-right"><button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button></div>
  </header>

  <div class="ro-strip">
    <span class="ro-score">Score <b id="score">0</b></span>
    <span class="ro-bands">Bands <b id="bands">0</b></span>
    <span class="ro-best">Best <b id="best">0</b></span>
  </div>
  <section id="field" class="ro-field fit-grow fit-box" aria-label="The dial">
    <canvas id="dial" class="ro-dial" role="img" aria-label="The dial"></canvas>
    <svg id="flat" class="ro-flat" viewBox="-1.32 -1.32 2.64 2.64" role="img" aria-label="The dial" hidden></svg>
    <div id="fx" class="ro-fx" aria-hidden="true"></div>
  </section>
  <p id="line" class="ro-line" role="status" aria-live="polite"></p>

  <section class="ro-side">
    <div id="tray" class="ro-tray">
      <button class="ro-cut" type="button" data-slot="0"></button>
      <button class="ro-cut" type="button" data-slot="1"></button>
      <button class="ro-cut" type="button" data-slot="2"></button>
    </div>
    <div id="result" class="ro-result" hidden>
      <p id="verdict" class="ro-verdict"></p>
      <button class="ro-go" type="button" id="againBtn">New game</button>
    </div>
  </section>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<p id="toast" class="ro-toast" role="status" aria-live="polite"></p>
<script type="module" src="rosette.js"></script>
</body>
</html>
