<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almanac">
<title>Timegrapher</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="timegrapher.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="timegrapher fit-screen beside">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon tg-mark" aria-hidden="true"></span>Timegrapher</button></h1>
    <div class="top-right"><button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button></div>
  </header>

  <div class="tg-strip">
    <span class="tg-tags"><b id="vphTag"></b><small id="liftTag"></small></span>
    <span class="tg-meter" id="meter" role="img" aria-label="Signal"><small>Signal</small><i></i><i></i><i></i><i></i><i></i></span>
  </div>
  <section id="trace" class="tg-trace fit-grow" aria-label="The trace; tap for the beat"><span class="tg-view" id="viewTag">Trace</span></section>
  <section class="tg-read" aria-label="The figures">
    <div class="tg-fig"><small>Rate</small><b id="rate">—</b><span id="rateSub">s/d</span></div>
    <div class="tg-fig"><small>Beat error</small><b id="be">—</b><span id="beSub">ms</span></div>
    <div class="tg-fig"><small>Amplitude</small><b id="amp">—</b><span id="ampSub">°</span></div>
  </section>
  <p id="line" class="tg-line" role="status" aria-live="polite"></p>
  <div class="tg-acts">
    <button class="btn tg-open" type="button" id="openBtn" aria-label="Open a recording">Open</button>
    <button class="btn primary tg-listen" type="button" id="listenBtn" aria-pressed="false">Listen</button>
  </div>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<input type="file" id="file" accept="audio/*,video/*,.m4a,.wav,.mp3,.mp4,.mov,.aac,.caf" hidden>
<script type="module" src="timegrapher.js"></script>
</body>
</html>
