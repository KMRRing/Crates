<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almanac">
<title>Timegrapher</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="dropdown.css">
<link rel="stylesheet" href="timegrapher.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="timegrapher fit-screen beside">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon tg-mark" aria-hidden="true"></span>Timegrapher</button></h1>
    <div class="top-right"><button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button></div>
  </header>

  <div class="tg-strip">
    <span class="tg-watch"><button id="thumbBtn" class="tg-thumb" type="button" aria-label="This watch in your library"></button><select id="watchSel" class="pool" data-accent="tg" aria-label="Watch"></select><small id="calTag"></small></span>
    <span class="tg-meter" id="meter" role="img" aria-label="Signal"><small>Signal</small><i></i><i></i><i></i><i></i><i></i></span>
  </div>
  <section id="trace" class="tg-trace fit-grow" aria-label="The trace; tap for the beat"><span class="tg-view" id="viewTag">Trace</span></section>
  <section class="tg-read" aria-label="The figures">
    <div class="tg-fig"><small>Rate</small><b id="rate">—</b><span id="rateSub">s/d</span></div>
    <div class="tg-fig"><small>Beat error</small><b id="be">—</b><span id="beSub">ms</span></div>
    <div class="tg-fig"><small>Amplitude</small><b id="amp">—</b><span id="ampSub">°</span></div>
  </section>
  <ol id="steps" class="tg-steps" aria-label="The positions" hidden></ol>
  <p id="line" class="tg-line" role="status" aria-live="polite"></p>
  <div class="tg-acts" id="acts">
    <button class="btn tg-open" type="button" id="openBtn" aria-label="Open a recording">Open</button>
    <button class="btn tg-which" type="button" id="whichBtn">Which?</button>
    <button class="btn tg-skip" type="button" id="skipBtn" hidden>Skip</button>
    <button class="btn primary tg-listen" type="button" id="listenBtn" aria-pressed="false">Listen</button>
    <button class="btn tg-end" type="button" id="endBtn" hidden>End</button>
  </div>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<dialog id="resultDlg" class="sheet tg-sheet" aria-labelledby="resHead">
  <div class="pick-head"><h2 id="resHead"></h2><button class="icon-btn" type="button" id="resClose" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <p id="resWhat" class="tg-what"></p>
  <table id="resTable" class="tg-table"></table>
  <dl id="resChecks" class="tg-checks"></dl>
  <div id="resWords" class="tg-words"></div>
</dialog>

<dialog id="histDlg" class="sheet tg-sheet" aria-labelledby="histHead">
  <div class="pick-head"><h2 id="histHead"></h2><button class="icon-btn" type="button" id="histClose" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <p id="histWorn" class="tg-what"></p>
  <ul id="histList" class="tg-hist"></ul>
</dialog>

<dialog id="wornDlg" class="sheet tg-sheet" aria-labelledby="wornHead">
  <div class="pick-head"><h2 id="wornHead"></h2><button class="icon-btn" type="button" id="wornClose" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="tg-worn">
    <p class="tg-clock" id="wornClock" aria-label="The phone's clock"></p>
    <button class="btn primary tg-tap" type="button" id="tapBtn">Tap as its seconds hand reaches 12</button>
    <div class="tg-last" id="wornLast" hidden><span id="wornOff"></span><button class="btn" type="button" id="minusBtn" aria-label="The watch shows a minute less">−1 min</button><button class="btn" type="button" id="plusBtn" aria-label="The watch shows a minute more">+1 min</button></div>
    <p class="tg-worn-rate"><small>As worn</small><b id="wornRate">—</b><span id="wornNote"></span></p>
    <button class="btn tg-set" type="button" id="setBtn" aria-pressed="false">I set the watch: the next tap starts afresh</button>
    <ul id="wornList" class="tg-log"></ul>
  </div>
</dialog>

<dialog id="askDlg" class="sheet tg-sheet" aria-labelledby="askHead">
  <h2 id="askHead"></h2>
  <input id="askInput" type="text" maxlength="60" autocomplete="off" aria-labelledby="askHead">
  <div class="tg-ask"><button class="btn" type="button" id="askCancel">Cancel</button><button class="btn primary" type="button" id="askOk">Keep</button></div>
</dialog>

<dialog id="libDlg" class="sheet tg-sheet" aria-labelledby="libHead">
  <div class="pick-head"><h2 id="libHead">Your watches</h2><button class="icon-btn" type="button" id="libClose" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <ul id="libList" class="tg-lib"></ul>
  <button class="btn tg-add" type="button" id="libAdd">Add a watch</button>
</dialog>

<dialog id="watchDlg" class="sheet tg-sheet" aria-labelledby="wName">
  <div class="pick-head"><h2 class="tg-wtitle">Watch</h2><button class="icon-btn" type="button" id="watchClose" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="tg-card">
    <button class="tg-photo" type="button" id="photoBtn" aria-label="Its photo: tap to add or change"></button>
    <div class="tg-fields">
      <label><small>Name</small><input id="wName" type="text" maxlength="60" autocomplete="off"></label>
      <label><small>Reference</small><input id="wRef" type="text" maxlength="40" autocomplete="off" placeholder="e.g. Q2788520"></label>
      <label><small>Calibre</small><select id="wCal"></select></label>
      <label><small>Last service</small><input id="wServed" type="date"></label>
    </div>
  </div>
  <label class="tg-desc"><small>Description</small><textarea id="wDesc" maxlength="1000" rows="3" placeholder="Case, dial, strap, where it came from…"></textarea></label>
  <section class="tg-health" aria-label="How it's keeping">
    <p class="tg-status" id="wStatus"></p>
    <div id="wLines" class="tg-words"></div>
    <div class="tg-charts" id="wCharts"></div>
  </section>
  <div class="tg-wacts">
    <button class="btn primary" type="button" id="wUse">Put it on the microphone</button>
    <button class="btn" type="button" id="wHist">History</button>
    <button class="btn link" type="button" id="wRemove">Remove</button>
  </div>
</dialog>

<dialog id="idDlg" class="sheet tg-sheet" aria-labelledby="idHead">
  <div class="pick-head"><h2 id="idHead">Which watch</h2><button class="icon-btn" type="button" id="idClose" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <p id="idWhat" class="tg-what"></p>
  <ul id="idList" class="tg-lib"></ul>
  <button class="btn tg-add" type="button" id="idOther">Another watch</button>
</dialog>

<input type="file" id="photoFile" accept="image/*" hidden>
<input type="file" id="file" accept="audio/*,video/*,.m4a,.wav,.mp3,.mp4,.mov,.aac,.caf" hidden>
<script type="module" src="timegrapher.js"></script>
</body>
</html>
