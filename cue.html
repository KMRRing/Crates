<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almanac">
<title>Cue</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="cue.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="cue fit-screen wide">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon cu-mark" aria-hidden="true"></span>Cue</button></h1>
    <div class="top-right">
      <button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button>
    </div>
  </header>
  <main id="stage" class="cu-stage fit-grow" role="button" tabindex="0" aria-label="The next word">
    <div class="cu-card" aria-live="polite">
      <p id="kind" class="cu-kind" hidden></p>
      <p id="word" class="cu-word"></p>
      <div id="dial" class="cu-dial" role="timer" aria-live="off" data-phase="idle" hidden>
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <circle class="cu-track" cx="50" cy="50" r="43"/>
          <circle id="dialArc" class="cu-arc" cx="50" cy="50" r="43" pathLength="100" transform="rotate(-90 50 50)"/>
          <path class="cu-ticks" d="M50 1V9M92.4 74.5L85.5 70.5M7.6 74.5L14.5 70.5"/>
        </svg>
        <span id="dialNum" class="cu-num"></span>
      </div>
      <p id="hint" class="cu-hint">Tap anywhere for a word</p>
    </div>
  </main>
  <div class="cu-foot">
    <button id="back" class="link cu-back" type="button" disabled>Back</button>
    <span id="count" class="cu-count"></span>
  </div>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<script type="module" src="cue.js"></script>
</body>
</html>
