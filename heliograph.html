<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almanac">
<title>Heliograph</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="heliograph.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="heliograph fit-screen beside">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon hg-mark" aria-hidden="true"></span>Heliograph</button></h1>
    <div class="top-right"><button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button></div>
  </header>

  <div class="hg-strip">
    <span class="hg-score">Score <b id="score">0</b></span>
    <span class="hg-pips"><span id="moves" class="hg-moves" title="Moves left this shot"></span><span id="drop" class="hg-drop" title="Shots until the chandelier comes down"></span></span>
    <span class="hg-best">Best <b id="best">0</b></span>
  </div>
  <section id="field" class="hg-field fit-grow fit-box" aria-label="The tube">
    <div id="stage" class="hg-stage" role="img" aria-label="The tube, its crystals, mirrors and light"></div>
    <p id="pop" class="hg-pop" aria-hidden="true"></p>
  </section>

  <section class="hg-side">
    <p id="say" class="hg-say" role="status" aria-live="polite"></p>
    <div id="tray" class="hg-tray">
      <div class="hg-colour" id="colour" aria-label="The colour crystal's colour, and the next"></div>
      <button class="hg-piece" type="button" id="mirrorBtn" aria-label="A mirror: drag it into the tube"></button>
      <button class="btn hg-take" type="button" id="takeBtn">Take back</button>
      <button class="hg-go" type="button" id="fireBtn">Fire</button>
    </div>
    <div id="result" class="hg-result" hidden>
      <p id="verdict" class="hg-verdict"></p>
      <button class="hg-go" type="button" id="againBtn">New game</button>
    </div>
  </section>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<p id="toast" class="hg-toast" role="status" aria-live="polite"></p>
<script type="module" src="heliograph.js"></script>
</body>
</html>
