# A side branch, not main: Wikimedia Commons can't be reached from where the games are written, so this branch's
# runner looks for the Bavarian pattern's cards there (fetch/list.mjs) and commits what it finds back to this branch,
# a step at a time. Nothing here is served or tested; the cards chosen are copied to main by hand, with their licences.
name: Fetch Bavarian cards
on:
  push:
    branches: [fetch/bavarian-cards]
    paths: [fetch/*.mjs, fetch/*.json, .github/workflows/fetch.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Commit helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '#!/bin/sh\ngit add -A out\ngit diff --cached --quiet && { echo "nothing new"; exit 0; }\ngit commit -q -m "$1"\ngit pull -q --rebase origin fetch/bavarian-cards\ngit push origin HEAD:fetch/bavarian-cards\n' > /tmp/save.sh
          chmod +x /tmp/save.sh
      - name: Can the runner reach Commons
        run: |
          mkdir -p out
          { date -u; curl -sS -m 20 -o /dev/null -w "api %{http_code} %{time_total}s\n" -A "AlmanacCards/1.0 (https://github.com/KMRRing/Crates)" "https://commons.wikimedia.org/w/api.php?action=query&meta=siteinfo&format=json"; } > out/probe.txt 2>&1 || true
          cat out/probe.txt
      - name: The cards wanted
        if: hashFiles('fetch/want.json') != ''
        timeout-minutes: 15
        run: node fetch/list.mjs cards > out/log-cards.txt 2>&1 || true
      - name: Index of Commons
        if: hashFiles('fetch/want.json') == ''
        timeout-minutes: 12
        run: timeout 600 node fetch/list.mjs index > out/log-index.txt 2>&1 || true
      - name: Thumbnails
        if: hashFiles('fetch/want.json') == '' && hashFiles('out/index.json') != ''
        timeout-minutes: 18
        run: timeout 900 node fetch/list.mjs thumbs > out/log-thumbs.txt 2>&1 || true
      - name: Commit what was found
        if: always()
        run: /tmp/save.sh "Found on Commons"
