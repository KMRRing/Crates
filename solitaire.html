<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Codex">
<title>Solitaire</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="dropdown.css">
<link rel="stylesheet" href="cards.css">
<link rel="stylesheet" href="cardroom.css">
<link rel="stylesheet" href="course.css">
<link rel="stylesheet" href="table3d.css">
<link rel="stylesheet" href="solitaire.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="solitaire full titled fit-screen beside">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon so-mark" aria-hidden="true"></span>Solitaire</button></h1>
    <div class="top-right">
      <select id="variant" class="pool" data-accent="so" aria-label="Game">
        <option value="klondike1" data-note="Seven columns, one card turned at a time">Klondike · draw one</option>
        <option value="klondike3" data-note="Seven columns, three cards turned at a time">Klondike · draw three</option>
        <option value="freecell" data-note="Every card face up, four free cells">FreeCell</option>
        <option value="spider1" data-note="Ten columns, one suit">Spider · one suit</option>
        <option value="spider2" data-note="Ten columns, spades and hearts">Spider · two suits</option>
        <option value="spider4" data-note="Ten columns, all four suits">Spider · four suits</option>
      </select>
      <button id="learnBtn" class="pick" aria-haspopup="dialog">Learn</button>
      <button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button>
    </div>
  </header>

  <div class="so-strip full-pull cr-strip" id="strip">
    <span class="so-time">Time <b id="time">0:00</b></span>
    <span class="so-moves">Moves <b id="moves">0</b></span>
    <span class="so-kind" id="kind"></span>
  </div>

  <section class="so-card tk-mahogany fit-grow fit-box" aria-label="The table">
    <div id="table" class="so-table"></div>
    <button class="so-tilt" type="button" id="tiltBtn" hidden aria-label="Camera: tap to change the tilt"></button>
  </section>

  <section class="so-side">
    <div id="controls" class="so-controls">
      <p id="line" class="so-say" aria-live="polite"></p>
      <div class="so-tools" role="group" aria-label="Tools">
        <button class="so-tool" type="button" id="undoBtn"><b>Undo</b></button>
        <button class="so-tool" type="button" id="redoBtn"><b>Redo</b></button>
        <button class="so-tool" type="button" id="hintBtn"><b>Hint</b></button>
      </div>
    </div>
    <div id="result" class="so-result" hidden>
      <p class="so-verdict" id="verdict"></p>
      <button class="so-go" type="button" id="nextBtn">New deal</button>
    </div>
  </section>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<dialog id="rulesDlg" class="sheet so-sheet" aria-label="Rules">
  <div class="pick-head"><h2>Rules</h2><button class="btn" type="button" id="rulesClose">Close</button></div>
  <div id="rulesBody" class="so-rules"></div>
</dialog>

<script type="module" src="solitaire.js"></script>
</body>
</html>
