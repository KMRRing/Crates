<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Codex">
<title>Census</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="census.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="census full titled fit-screen">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon ce-mark" aria-hidden="true"></span>Census</button></h1>
    <div class="top-right"><button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button></div>
  </header>
  <div class="ce-strip full-pull"><span id="where"></span><span id="clock" class="ce-clock"></span></div>
  <section class="ce-ask">
    <h2 id="title" class="ce-title"></h2>
    <p id="ask" class="ce-q"></p>
  </section>
  <form id="form" class="ce-form" autocomplete="off">
    <input id="typed" class="ce-input" type="text" inputmode="text" enterkeyhint="done" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Type a member of the set">
    <button class="btn primary" type="submit" id="go">Add</button>
  </form>
  <p id="note" class="ce-note" role="status" aria-live="polite"></p>
  <section id="found" class="ce-found fit-grow fit-scroll" aria-label="Found so far"></section>
  <div class="ce-bar">
    <button class="btn" type="button" id="giveBtn">Give up</button>
    <button class="btn primary" type="button" id="nextBtn" hidden>Next set</button>
  </div>
</div>
<dialog id="doneDlg" class="sheet" aria-label="How it went">
  <div class="pick-head"><h2 id="doneTitle">Done</h2><button class="btn" type="button" id="doneClose">Close</button></div>
  <div id="doneBody"></div>
</dialog>
<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>
<script type="module" src="census.js"></script>
<script type="module" src="sfx.js"></script>
</body>
</html>
