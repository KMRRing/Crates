<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almanac">
<title>Dandan</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="dandan.css">
<link rel="stylesheet" href="dandan-3d.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="dandan fit-screen wide">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon dd-mark" aria-hidden="true"></span>Dandan</button></h1>
    <div class="top-right">
      <div id="quick" class="dd-quick" role="group" aria-label="Hold priority and land tapping">
        <button id="holdBtn" class="pick dd-tog" type="button" aria-pressed="false" title="Hold priority when I cast" aria-label="Hold priority when I cast"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6.5 4v12M13.5 4v12"/></svg></button>
        <button id="tapBtn" class="pick dd-tog" type="button" aria-pressed="false" title="Choose which lands to tap" aria-label="Choose which lands to tap"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M15.6 6.2A6.6 6.6 0 1 0 16.6 11.5"/><path d="M16 2.6v4.2h-4.2"/></svg></button>
      </div>
      <button id="rulesBtn" class="pick" aria-haspopup="dialog">Rules</button>
      <button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button>
    </div>
  </header>

  <section id="board" class="dd-board fit-grow" aria-label="The table">
    <div id="foe" class="dd-zone foe"></div>
    <div id="mid" class="dd-strip" aria-live="polite"></div>
    <div id="me" class="dd-zone me"></div>
    <div class="dd-below">
      <div id="read" class="dd-read" aria-label="The card"></div>
      <ol id="log" class="dd-log" aria-label="What has happened"></ol>
    </div>
  </section>
  <section id="board3d" class="d3-board fit-grow" aria-label="The table" hidden></section>
  <section id="side" class="dd-side">
    <div id="hand" class="dd-hand" aria-label="Your hand"></div>
    <div id="coach" class="dd-coach" aria-live="polite" hidden></div>
    <div id="controls" class="dd-controls"></div>
  </section>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<dialog id="rulesDlg" class="sheet dd-sheet" aria-label="Rules">
  <div class="pick-head"><h2>Rules</h2><button class="btn" type="button" id="rulesClose">Close</button></div>
  <div id="rulesBody" class="dd-rules"></div>
</dialog>

<dialog id="askDlg" class="sheet dd-sheet" aria-labelledby="askHead" autofocus>
  <div class="pick-head"><h2 id="askHead"></h2><button class="btn" type="button" id="askLook">The table</button></div>
  <div id="askBody" class="dd-ask"></div>
</dialog>

<dialog id="viewDlg" class="sheet dd-sheet" aria-labelledby="viewHead" autofocus>
  <div class="pick-head"><h2 id="viewHead"></h2><button class="btn" type="button" id="viewClose">Close</button></div>
  <div id="viewBody" class="dd-view"></div>
</dialog>

<dialog id="cardDlg" class="sheet dd-sheet dd-cardsheet" aria-labelledby="cardHead">
  <div class="pick-head"><h2 id="cardHead"></h2><button class="btn" type="button" id="cardClose">Close</button></div>
  <div id="cardBody" class="dd-cardbody"></div>
  <div id="cardGo" class="dd-cardgo"></div>
</dialog>

<dialog id="whyDlg" class="sheet dd-sheet" aria-labelledby="whyHead">
  <div class="pick-head"><h2 id="whyHead">The coach's choices</h2><button class="btn" type="button" id="whyClose">Close</button></div>
  <div id="whyBody" class="dd-why-body"></div>
</dialog>

<dialog id="reviewDlg" class="sheet dd-sheet" aria-labelledby="reviewHead">
  <div class="pick-head"><h2 id="reviewHead">Review</h2><button class="btn" type="button" id="reviewClose">Close</button></div>
  <div id="reviewBody" class="dd-rv"></div>
</dialog>

<dialog id="endDlg" class="sheet dd-sheet" aria-labelledby="endHead" tabindex="-1">
  <h2 id="endHead" class="dd-end-head"></h2>
  <div id="endBody" class="dd-end"></div>
  <div class="dd-end-acts"><button class="btn" type="button" id="endTable">The table</button><button class="btn primary" type="button" id="endAgain">New game</button></div>
</dialog>

<dialog id="copyDlg" class="sheet dd-sheet" aria-labelledby="copyHead">
  <div class="pick-head"><h2 id="copyHead">Copy</h2><button class="btn" type="button" id="copyClose">Close</button></div>
  <p class="dd-sub">This browser wouldn’t copy it: select it here and copy.</p>
  <textarea id="copyText" class="dd-copy" readonly></textarea>
</dialog>

<p id="toast" class="dd-toast" role="status" aria-live="polite"></p>
<script type="module" src="dandan.js"></script>
</body>
</html>
