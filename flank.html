<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Codex">
<title>Reversi</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="course.css">
<link rel="stylesheet" href="flank.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="flank full fit-screen beside">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon fk-mark" aria-hidden="true"></span>Reversi</button></h1>
    <div class="top-right">
      <button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button>
    </div>
  </header>

  <p id="status" class="fk-status full-pull" aria-live="polite"></p>
  <section id="table" class="fk-table fit-grow" aria-label="The board">
    <div id="far" class="fk-seat far"></div>
    <div id="stage" class="fk-stage"><div id="board" class="fk-board"></div></div>
    <div id="near" class="fk-seat near"></div>
  </section>
  <section id="side" class="fk-side" aria-label="The game">
    <div id="ahead" class="fk-ahead" aria-live="polite" hidden></div>
    <div id="controls" class="fk-controls"></div>
  </section>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<dialog id="rulesDlg" class="sheet fk-sheet" aria-label="Rules">
  <div class="pick-head"><h2>Rules</h2><button class="btn" type="button" id="rulesClose">Close</button></div>
  <div id="rulesBody" class="fk-rules"></div>
</dialog>

<dialog id="endDlg" class="sheet fk-sheet" aria-labelledby="endHead">
  <h2 id="endHead" class="fk-end-head"></h2>
  <div id="endBody" class="fk-end"></div>
  <div class="fk-end-go"><button class="btn" type="button" id="endBoard">The board</button><button class="btn primary" type="button" id="endAgain">New game</button></div>
</dialog>

<p id="toast" class="fk-toast" role="status" aria-live="polite"></p>
<script type="module" src="flank.js"></script>
</body>
</html>
