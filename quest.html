<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almanac">
<title>Quest</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="quest.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="quest fit-screen beside">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon qs-mark" aria-hidden="true"></span>Quest</button></h1>
    <div class="top-right">
      <button id="rulesBtn" class="pick" aria-haspopup="dialog">Rules</button>
      <button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button>
    </div>
  </header>

  <section id="board" class="qs-board fit-grow" aria-label="The table">
    <div id="ring" class="qs-ring">
      <div id="centre" class="qs-centre" aria-live="polite"></div>
      <div id="pop" class="qs-pop" role="dialog" hidden></div>
    </div>
  </section>
  <section id="side" class="qs-side" aria-label="Your role and your part">
    <button id="role" class="qs-role" type="button" aria-expanded="true"></button>
    <div id="status" class="qs-status"><div id="statusOld" class="qs-old"></div><p id="statusNow" class="qs-now-line" aria-live="polite"></p></div>
    <div id="controls" class="qs-controls"></div>
  </section>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<dialog id="rulesDlg" class="sheet qs-sheet" aria-label="Rules">
  <div class="pick-head"><h2>Rules</h2><button class="btn" type="button" id="rulesClose">Close</button></div>
  <div id="rulesBody" class="qs-rules"></div>
</dialog>

<dialog id="logDlg" class="sheet qs-sheet" aria-label="The parties so far">
  <div class="pick-head"><h2>So far</h2><button class="btn" type="button" id="logClose">Close</button></div>
  <div id="logBody" class="qs-log"></div>
</dialog>

<dialog id="endDlg" class="sheet qs-sheet" aria-labelledby="endHead">
  <h2 id="endHead" class="qs-end-head"></h2>
  <div id="endBody" class="qs-end"></div>
  <div class="qs-end-go"><button class="btn" type="button" id="endTable">The table</button><button class="btn primary" type="button" id="endAgain">New game</button></div>
</dialog>

<p id="toast" class="qs-toast" role="status" aria-live="polite"></p>
<script type="module" src="quest.js"></script>
</body>
</html>
