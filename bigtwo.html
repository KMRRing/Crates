<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almanac">
<title>Big Two</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="cards.css">
<link rel="stylesheet" href="course.css">
<link rel="stylesheet" href="bigtwo.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="bigtwo fit-screen beside">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon b2-mark" aria-hidden="true"></span>Big Two</button></h1>
    <div class="top-right">
      <button id="learnBtn" class="pick" aria-haspopup="dialog">Learn</button>
      <button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button>
    </div>
  </header>

  <p id="strip" class="b2-strip"></p>
  <section id="table" class="b2-table fit-grow" aria-label="The table"></section>
  <section id="side" class="b2-side" aria-label="Your cards">
    <p id="status" class="b2-status" aria-live="polite"></p>
    <div id="hand" class="b2-hand cd-row" role="group" aria-label="Your cards"></div>
    <div id="bar" class="b2-bar"></div>
  </section>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<dialog id="rulesDlg" class="sheet b2-sheet" aria-label="Rules">
  <div class="pick-head"><h2>Rules</h2><button class="btn" type="button" id="rulesClose">Close</button></div>
  <div id="rulesBody" class="b2-rules"></div>
</dialog>

<dialog id="endDlg" class="sheet b2-sheet" aria-labelledby="endHead">
  <h2 id="endHead" class="b2-end-head"></h2>
  <div id="endBody" class="b2-end"></div>
  <div class="b2-end-go"><button class="btn" type="button" id="endTable">The table</button><button class="btn primary" type="button" id="endAgain">New game</button></div>
</dialog>

<dialog id="whyDlg" class="sheet b2-sheet" aria-labelledby="whyHead">
  <div class="pick-head"><h2 id="whyHead">The coach's choices</h2><button class="btn" type="button" id="whyClose">Close</button></div>
  <div id="whyBody" class="b2-whybody"></div>
</dialog>

<p id="toast" class="b2-toast" role="status" aria-live="polite"></p>
<script type="module" src="bigtwo.js"></script>
</body>
</html>
