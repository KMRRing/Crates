<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almanac">
<title>Lots</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="dropdown.css">
<link rel="stylesheet" href="duel.css">
<link rel="stylesheet" href="lots.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="lots fit-screen beside">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon lt-mark" aria-hidden="true"></span>Lots</button></h1>
    <div class="top-right">
      <select id="level" class="pool" data-accent="lt" aria-label="Level">
        <option value="easy" data-note="Plain links, no red herrings">Easy</option>
        <option value="medium" data-note="Plain to devious, sometimes a red herring">Medium</option>
        <option value="hard" data-note="Devious links, always a red herring">Hard</option>
      </select>
      <button id="rulesBtn" class="pick" aria-haspopup="dialog">Rules</button>
      <button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button>
    </div>
  </header>

  <div class="lt-strip">
    <span class="lt-what" id="what"></span>
    <span class="lt-count" id="count"></span>
  </div>
  <p class="lt-rival" id="rival" hidden></p>

  <section class="lt-stage fit-grow fit-box" aria-label="The board">
    <div class="lt-board" id="board"></div>
  </section>

  <ol class="lt-feed" id="feed" aria-label="Your guesses so far"></ol>
  <p class="lt-line" id="line" aria-live="polite"></p>
  <div class="lt-controls" id="controls">
    <button class="btn" type="button" id="shuffleBtn">Shuffle</button>
    <button class="btn" type="button" id="clearBtn">Deselect</button>
    <button class="btn primary" type="button" id="submitBtn">Submit</button>
  </div>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Lots</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<dialog id="rulesDlg" class="sheet lt-sheet" aria-label="Rules">
  <div class="pick-head"><h2>Rules</h2><button class="btn" type="button" id="rulesClose">Close</button></div>
  <div id="rulesBody" class="lt-rules"></div>
</dialog>

<dialog id="nameDlg" class="sheet lt-namer" aria-labelledby="nameHead">
  <p class="lt-name-head" id="nameHead"></p>
  <p class="lt-name-words" id="nameWords"></p>
  <div class="lt-name-opts" id="nameOpts"></div>
  <p class="lt-name-note" id="nameNote"></p>
</dialog>

<dialog id="whoDlg" class="sheet">
  <form method="dialog" id="whoForm">
    <label for="whoInput">Your name, as your partner will see it</label>
    <input id="whoInput" autocomplete="nickname" autocapitalize="words" spellcheck="false" enterkeyhint="done" maxlength="16">
    <div class="controls"><button type="submit" class="btn primary">Continue</button></div>
  </form>
</dialog>

<p id="toast" class="lt-toast" role="status" aria-live="polite"></p>
<script type="module" src="lots.js"></script>
</body>
</html>
