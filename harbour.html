<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almanac">
<title>Harbour</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="dropdown.css">
<link rel="stylesheet" href="harbour.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="harbour fit-screen">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon hb-mark" aria-hidden="true"></span>Harbour</button></h1>
    <div class="top-right">
      <select id="level" class="pool" aria-label="Level" data-accent="hb"></select>
      <button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button>
    </div>
  </header>

  <p id="brief" class="hb-brief"></p>
  <p id="viewing" class="hb-viewing" hidden><span id="viewingText"></span><button type="button" id="mineBtn" class="hb-mine">Back to your plan</button></p>
  <div id="sea" class="hb-sea fit-box fit-grow"></div>
  <div id="classes" class="hb-classes" role="group" aria-label="The fleet: tap a class for the next ship, or to swap the picked one"></div>
  <div id="tape" class="hb-tape" aria-label="Programs, one row per ship"></div>
  <div id="tools" class="hb-tools" role="toolbar" aria-label="Instructions"></div>
  <input id="scrub" class="hb-scrub" type="range" min="0" max="1" step="1" value="0" disabled aria-label="The run, hour by hour: back to any hour played">
  <div class="hb-run">
    <span class="hb-pair"><button id="undoBtn" class="hb-ctl" type="button" aria-label="Undo"></button><button id="redoBtn" class="hb-ctl" type="button" aria-label="Redo"></button></span>
    <button id="resetBtn" class="hb-ctl" type="button" aria-label="Back to the start"></button>
    <button id="stepBtn" class="hb-ctl" type="button" aria-label="One hour"></button>
    <button id="runBtn" class="hb-ctl primary" type="button" aria-label="Run"></button>
    <button id="speedBtn" class="hb-ctl" type="button" aria-label="Speed">1×</button>
  </div>
  <p id="status" class="hb-status" aria-live="polite"></p>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Harbour</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<script type="module" src="harbour.js"></script>
</body>
</html>
