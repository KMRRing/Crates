<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almanac">
<title>Spot</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="spot.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="spot wide">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon sp-mark" aria-hidden="true"></span>Spot</button></h1>
    <div class="top-right"><button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button></div>
  </header>

  <p id="partner" class="sp-partner" hidden></p>
  <main class="sp-main">
    <div class="sp-hud" aria-live="polite">
      <span class="sp-score"><b id="score">0</b><small id="mult"></small></span>
      <span id="modifier" class="sp-mod" hidden><small>then</small><b></b></span>
      <span class="sp-right"><span id="level" class="sp-level"></span><span id="lives" class="sp-lives" aria-label="Lives"></span></span>
    </div>
    <section id="field" class="sp-field" aria-label="Sums"></section>
    <section id="shelf" class="sp-shelf" aria-label="Answers"></section>
    <div id="overlay" class="sp-overlay">
      <div class="sp-card" id="card"></div>
    </div>
  </main>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<dialog id="nameDlg" class="sheet" aria-label="Your name">
  <form method="dialog" id="nameForm">
    <label for="nameInput">Your name, so your partner knows who's playing</label>
    <input id="nameInput" maxlength="16" autocomplete="nickname" required>
    <button class="btn primary wide" type="submit">Continue</button>
  </form>
</dialog>

<p id="toast" class="sp-toast" role="status" aria-live="polite"></p>
<script type="module" src="spot.js"></script>
</body>
</html>
