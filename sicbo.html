<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almanac">
<title>Sic Bo</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="course.css">
<link rel="stylesheet" href="casino.css">
<link rel="stylesheet" href="casino-dice.css">
<link rel="stylesheet" href="sicbo.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="sicbo fit-screen beside">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon sb-mark" aria-hidden="true"></span>Sic Bo</button></h1>
    <div class="top-right">
      <button id="learnBtn" class="pick" aria-haspopup="dialog">Learn</button>
      <button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button>
    </div>
  </header>

  <div class="cs-strip sb-strip">
    <span>HK$ <b id="balance">0</b></span>
    <span id="limits" class="cs-cut"></span>
    <span id="rounds" class="cs-cut"></span>
  </div>

  <section id="board" class="sb-board" aria-label="The screen over the table">
    <div id="last" class="sb-last" aria-label="The last rounds' totals, newest first"></div>
    <div id="stats" class="sb-stats"></div>
  </section>

  <section id="tray" class="sb-tray" aria-label="The dice">
    <div id="dice" class="sb-dice"></div>
    <p id="call" class="sb-call" aria-live="polite"></p>
  </section>

  <section id="felt" class="sb-felt fit-grow" aria-label="The layout">
    <div id="layout" class="sb-layout"></div>
  </section>

  <section class="cs-rail sb-rail" aria-label="Your chips">
    <div id="chips" class="cs-chips" role="radiogroup" aria-label="Chip"></div>
    <div class="cs-go">
      <button id="clearBtn" class="cs-btn" type="button">Clear</button>
      <button id="undoBtn" class="cs-btn" type="button">Rebet</button>
      <button id="rollBtn" class="cs-btn primary" type="button">Roll</button>
    </div>
  </section>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<dialog id="rulesDlg" class="sheet" aria-label="The rules on one page">
  <div class="pick-head"><h2>Sic Bo on one page</h2><button class="btn" type="button" id="rulesClose">Close</button></div>
  <div id="rulesBody" class="cs-rules"></div>
</dialog>

<p id="toast" class="cs-toast" role="status" aria-live="polite"></p>
<script type="module" src="sicbo.js"></script>
</body>
</html>
