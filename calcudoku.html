<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almanac">
<title>Calcudoku</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="dropdown.css">
<link rel="stylesheet" href="duel.css">
<link rel="stylesheet" href="digits.css">
<link rel="stylesheet" href="calcudoku.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="calcudoku fit-screen beside">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon cd-mark" aria-hidden="true"></span>Calcudoku</button></h1>
    <div class="top-right">
      <select id="size" class="pool" data-accent="cd" aria-label="Size">
        <option value="4">4×4</option>
        <option value="5">5×5</option>
        <option value="6">6×6</option>
        <option value="7">7×7</option>
        <option value="8">8×8</option>
        <option value="9">9×9</option>
      </select>
      <button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button>
    </div>
  </header>

  <div class="cd-strip">
    <span class="cd-clock"><b id="clock">0:00</b><small id="penalty"></small></span>
    <span id="kind" class="cd-kind"></span>
    <span id="rival" class="cd-rival" hidden></span>
    <span id="table" class="cd-rival" hidden></span>
  </div>

  <section class="cd-stage fit-grow fit-box" aria-label="The grid">
    <div id="board" class="cd-board"></div>
  </section>

  <section class="cd-side">
    <p id="line" class="cd-line" aria-live="polite"></p>
    <div id="pad" class="cd-pad"></div>
    <div id="result" class="cd-result" hidden>
      <p id="verdict" class="cd-verdict"></p>
      <div class="cd-next">
        <button class="cd-go" type="button" id="nextBtn">Another grid</button>
        <button class="btn cd-today" type="button" id="todayBtn" hidden>Today's grid</button>
      </div>
    </div>
  </section>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<p id="toast" class="cd-toast" role="status" aria-live="polite"></p>
<script type="module" src="calcudoku.js"></script>
</body>
</html>
