<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almanac">
<title>Kakuro</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="dropdown.css">
<link rel="stylesheet" href="duel.css">
<link rel="stylesheet" href="digits.css">
<link rel="stylesheet" href="kakuro.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="kakuro fit-screen beside">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon ka-mark" aria-hidden="true"></span>Kakuro</button></h1>
    <div class="top-right">
      <select id="level" class="pool" data-accent="ka" aria-label="Level">
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
        <option value="expert">Expert</option>
      </select>
      <button id="rulesBtn" class="pick" aria-haspopup="dialog">Rules</button>
      <button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button>
    </div>
  </header>

  <div class="ka-strip">
    <span class="ka-clock"><b id="clock">0:00</b><small id="penalty"></small></span>
    <span id="kind" class="ka-kind"></span>
    <span id="rival" class="ka-rival" hidden></span>
    <span id="table" class="ka-rival" hidden></span>
  </div>

  <section class="ka-stage fit-grow fit-box" aria-label="The grid">
    <div id="board" class="ka-board"></div>
  </section>

  <section class="ka-side">
    <p id="line" class="ka-line" aria-live="polite"></p>
    <div id="pad" class="ka-pad"></div>
    <div id="result" class="ka-result" hidden>
      <p id="verdict" class="ka-verdict"></p>
      <div class="ka-next">
        <button class="ka-go" type="button" id="nextBtn">Another grid</button>
        <button class="btn ka-today" type="button" id="todayBtn" hidden>Today's grid</button>
      </div>
    </div>
  </section>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<dialog id="rulesDlg" class="sheet ka-sheet" aria-label="Rules">
  <div class="pick-head"><h2>Rules</h2><button class="btn" type="button" id="rulesClose">Close</button></div>
  <div id="rulesBody" class="ka-rules"></div>
</dialog>

<p id="toast" class="ka-toast" role="status" aria-live="polite"></p>
<script type="module" src="kakuro.js"></script>
</body>
</html>
