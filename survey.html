<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E4E7E7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141B20" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Survey">
<title>Survey</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="survey.css">
</head>
<body>
<div id="app" class="survey fit-screen">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon sv-mark" aria-hidden="true"></span>Survey</button></h1>
    <div class="top-right">
      <select id="size" class="pool" aria-label="Size">
        <option value="small">Small</option>
        <option value="medium">Medium</option>
        <option value="large">Large</option>
        <option value="vast">Vast</option>
      </select>
      <button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button>
    </div>
  </header>

  <div class="sv-strip"><span id="brief"></span><span class="sv-credits">Credits <b id="credits"></b></span></div>

  <section class="sv-card fit-col fit-grow">
    <div class="sv-fit fit-box fit-grow"><div id="board" class="sv-board"></div></div>
    <div class="sv-tools" id="tools">
      <button class="sv-tool" type="button" data-tool="mark" aria-pressed="true"><b>Mark</b><small>free</small></button>
      <button class="sv-tool" type="button" data-tool="magnet"><b>Magnet</b><small>3 credits</small></button>
      <button class="sv-tool" type="button" data-tool="drill"><b>Drill</b><small>5 credits</small></button>
    </div>
    <p class="sv-hint" id="hint"></p>
    <button class="sv-go" type="button" id="claimBtn">File the claim</button>
    <div id="result" class="sv-result" hidden>
      <p class="sv-verdict" id="verdict"></p>
      <button class="sv-go" type="button" id="nextBtn">Another concession</button>
    </div>
  </section>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<p id="toast" class="sv-toast" role="status" aria-live="polite"></p>
<script type="module" src="survey.js"></script>
</body>
</html>
