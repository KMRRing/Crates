<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almanac">
<title>Gambit</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="duel.css">
<link rel="stylesheet" href="chess-board.css">
<link rel="stylesheet" href="gambit.css">
<link rel="stylesheet" href="rush.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<!-- Gambit's puzzle rush (Gambit, Menu, Puzzle rush): a page of Gambit's, under its header -->
<div id="app" class="rush fit-screen beside">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon gb-mark" aria-hidden="true"></span>Gambit</button></h1>
    <div class="top-right">
      <button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button>
    </div>
  </header>

  <div class="ru-hud">
    <span class="ru-solved"><b id="solved">0</b> solved <small class="ru-rating" id="ratingLine">rating <b id="rating"></b></small><small class="ru-rival" id="rival" hidden></small></span>
    <span class="ru-clock" id="clock"></span>
    <span id="strikes" class="ru-strikes" role="img" aria-label="Strikes"></span>
  </div>
  <p class="ru-line" id="line" aria-live="polite"></p>
  <section class="ru-stage fit-grow fit-box" aria-label="The board">
    <div id="board" class="ru-board"></div>
  </section>
  <p class="ru-meta" id="meta"></p>
  <div id="bar" class="ru-bar"></div>
</div>

<dialog id="doneDlg" class="sheet gb-sheet" aria-labelledby="doneTitle">
  <div class="pick-head"><h2 id="doneTitle">Time</h2><button class="btn" type="button" id="doneClose">Close</button></div>
  <div id="doneBody" class="ru-done"></div>
</dialog>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<p id="toast" class="gb-toast" role="status" aria-live="polite"></p>
<script type="module" src="rush.js"></script>
</body>
</html>
