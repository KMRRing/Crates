<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almanac">
<title>Bones</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="course.css">
<link rel="stylesheet" href="bones.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="bones fit-screen beside">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon bn-mark" aria-hidden="true"></span>Bones</button></h1>
    <div class="top-right">
      <button id="learnBtn" class="pick" aria-haspopup="dialog">Learn</button>
      <button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button>
    </div>
  </header>

  <div id="info" class="bn-info"></div>
  <section id="table" class="bn-table fit-grow" aria-label="The table">
    <div id="others" class="bn-others"></div>
    <div id="board" class="bn-board" aria-live="polite"></div>
  </section>
  <section id="side" class="bn-side" aria-label="Your tiles">
    <div id="hand" class="bn-hand" role="group" aria-label="Your tiles"></div>
    <p id="status" class="bn-status" aria-live="polite"></p>
    <div id="controls" class="bn-controls"></div>
  </section>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<dialog id="rulesDlg" class="sheet bn-sheet" aria-label="Rules">
  <div class="pick-head"><h2>Rules</h2><button class="btn" type="button" id="rulesClose">Close</button></div>
  <div id="rulesBody" class="bn-rules"></div>
</dialog>

<dialog id="endDlg" class="sheet bn-sheet" aria-labelledby="endHead">
  <h2 id="endHead" class="bn-end-head"></h2>
  <div id="endBody" class="bn-end"></div>
  <div class="bn-end-go"><button class="btn" type="button" id="endTable">The table</button><button class="btn primary" type="button" id="endAgain">New game</button></div>
</dialog>

<p id="toast" class="bn-toast" role="status" aria-live="polite"></p>
<script type="module" src="bones.js"></script>
</body>
</html>
