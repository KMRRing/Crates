<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Codex">
<title>Carrack</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="carrack.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="carrack full fit-screen beside">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon cr-mark" aria-hidden="true"></span>Carrack</button></h1>
    <div class="top-right">
      <button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button>
    </div>
  </header>

  <p id="strip" class="cr-strip full-pull"></p>
  <section id="board" class="cr-board" aria-label="The map"></section>
  <section id="side" class="cr-side fit-grow" aria-label="Orders, the year and the standings">
    <div id="tabs" class="cr-tabs" role="tablist"></div>
    <div id="panel" class="cr-panel fit-scroll" role="tabpanel" aria-live="polite"></div>
    <div id="bar" class="cr-bar"></div>
  </section>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<dialog id="rulesDlg" class="sheet cr-sheet" aria-label="Rules">
  <div class="pick-head"><h2 id="rulesHead">Rules</h2><button class="btn" type="button" id="rulesClose">Close</button></div>
  <div id="rulesBody" class="cr-rules"></div>
</dialog>

<dialog id="endDlg" class="sheet cr-sheet" aria-labelledby="endHead">
  <h2 id="endHead" class="cr-end-head"></h2>
  <div id="endBody" class="cr-end"></div>
  <div class="cr-end-go"><button class="btn" type="button" id="endTable">The map</button><button class="btn primary" type="button" id="endAgain">New game</button></div>
</dialog>

<p id="toast" class="cr-toast" role="status" aria-live="polite"></p>
<script type="module" src="carrack.js"></script>
</body>
</html>
