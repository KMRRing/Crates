<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DFC9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Codex">
<title>Maths</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="course.css">
<link rel="stylesheet" href="maths.css">
<link rel="stylesheet" href="odds.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="app" class="maths full titled fit-screen wide">
  <header class="top">
    <h1 class="mark"><button id="appsBtn" class="mark-btn" aria-haspopup="dialog">
      <span class="mark-icon ma-mark" aria-hidden="true"></span>Maths</button></h1>
    <div class="top-right">
      <button id="menuBtn" class="pick" aria-haspopup="dialog">Menu</button>
    </div>
  </header>

  <section id="home" class="ma-home fit-col fit-grow">
    <div class="ma-about fit-half">
      <p class="ma-intro" id="intro"></p>
      <div class="ma-stats" id="stats"></div>
      <button class="ma-go" type="button" id="goBtn">Start the course</button>
    </div>
    <div class="ma-chapters fit-half">
      <h3 class="ma-h">The chapters</h3>
      <div class="ma-list fit-scroll fit-grow" id="chapters"></div>
    </div>
  </section>
</div>

<dialog id="menuDlg" class="sheet" aria-label="Menu">
  <div class="pick-head"><h2>Menu</h2><button class="btn" type="button" id="menuClose">Close</button></div>
  <div id="menuBody"></div>
</dialog>

<script type="module" src="maths.js"></script>
<script type="module" src="sfx.js"></script>
</body>
</html>
