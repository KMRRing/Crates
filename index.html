<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#DCE1E3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131C22" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Crates">
<title>Crates</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700;900&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <h1 class="mark">Crates</h1>
    <button id="pickBtn" class="pick" aria-haspopup="dialog">No. <span id="pNum">1</span></button>
  </header>

  <div class="brief">
    <p id="brief">Sort the sixteen into four crates and name the country behind each.</p>
    <div class="lives" aria-label="Mistakes left"><span id="lives"></span></div>
  </div>

  <section id="solved" class="solved" aria-live="polite"></section>
  <section id="grid" class="grid" role="grid" aria-label="Words"></section>
  <p id="toast" class="toast" role="status" aria-live="polite"></p>

  <div id="controls" class="controls">
    <button id="shuffleBtn" class="btn">Shuffle</button>
    <button id="clearBtn" class="btn">Deselect</button>
    <button id="submitBtn" class="btn primary" disabled>Submit</button>
  </div>

  <section id="result" class="result" hidden>
    <p id="resultLine" class="result-line"></p>
    <pre id="shareGrid" class="share-grid"></pre>
    <div class="controls">
      <button id="shareBtn" class="btn">Copy result</button>
      <button id="nextBtn" class="btn primary">Next crate</button>
    </div>
  </section>
</div>

<dialog id="nameDlg" class="sheet">
  <form id="nameForm" method="dialog">
    <p class="sheet-words" id="nameWords"></p>
    <label for="nameInput" id="nameLabel">Which country links these four?</label>
    <input id="nameInput" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="done">
    <div class="controls">
      <button type="button" id="skipBtn" class="btn">Skip</button>
      <button type="submit" id="nameBtn" class="btn primary">Name it</button>
    </div>
  </form>
</dialog>

<dialog id="pickDlg" class="sheet">
  <div class="pick-head">
    <h2>Puzzles</h2>
    <button id="pickClose" class="btn">Close</button>
  </div>
  <ol id="pickList" class="pick-list"></ol>
  <p id="stats" class="stats"></p>
  <button id="resetBtn" class="link">Reset this puzzle</button>
</dialog>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
